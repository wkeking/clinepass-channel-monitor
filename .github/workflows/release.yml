name: release

# The tag is the release: v<version> (for example v0.1.0) both names the GitHub release
# and defines the version CPA compares against the installed plugin. The assets this
# workflow attaches are what the plugin store downloads, so their names and layout are
# fixed by CLIProxyAPI: <id>_<version>_<goos>_<goarch>.zip plus checksums.txt, one
# dynamic library at the zip root. scripts/release.sh enforces exactly that.
on:
  push:
    tags:
      - "v*"
    # Dry run: pushing this branch builds and uploads the archives for every platform
    # so a new matrix entry can be checked before the tag that publishes it. Only a
    # tag reaches the publish job, so this branch can never create a release.
    branches:
      - "release-dryrun"
  # The same dry run from the Actions tab; it never publishes either.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build; must match internal/buildinfo/buildinfo.go"
        required: true
        default: "0.1.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The plugin store audit requires every release to carry darwin/amd64,
          # darwin/arm64, linux/amd64, linux/arm64 and windows/amd64.
          # linux/* builds natively or cross-compiles with the matching GNU gcc,
          # darwin/* needs a macOS runner (the CGO linker wants the macOS SDK; Go
          # passes -arch x86_64 for GOARCH=amd64, so one runner covers both archs),
          # and windows/amd64 needs mingw-w64.
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            packages: gcc zip
          - runner: ubuntu-22.04
            goos: linux
            goarch: arm64
            packages: gcc-aarch64-linux-gnu zip
          - runner: ubuntu-22.04
            goos: windows
            goarch: amd64
            packages: gcc-mingw-w64-x86-64 zip
          - runner: macos-14
            goos: darwin
            goarch: arm64
            packages: ""
          - runner: macos-14
            goos: darwin
            goarch: amd64
            packages: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install the C toolchain
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Install the pinned Go toolchain
        run: make tools
      - name: Resolve the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            # Dry-run branch push: build the version the tree declares.
            version="$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/buildinfo/buildinfo.go | head -1)"
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
      - name: Build and package
        run: scripts/release.sh "${{ steps.version.outputs.version }}" ${{ matrix.goos }}/${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    # Only a tag push publishes; the dry-run branch and workflow_dispatch runs stop
    # after uploading the artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write checksums.txt
        run: |
          cd release
          sha256sum ./*.zip | sed 's| \./| |' | LC_ALL=C sort -k2 >checksums.txt
          cat checksums.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*.zip release/checksums.txt
