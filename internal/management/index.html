<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cline 渠道监控</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#15171c;--muted:#6a7280;--line:#e5e8ec;--accent:#2563eb;--accent-soft:rgba(37,99,235,.08);--warn:#b45309;--err:#b91c1c;--ok:#15803d;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#14181f;--fg:#e9ecf1;--muted:#8b95a5;--line:#222833;--accent:#60a5fa;--accent-soft:rgba(96,165,250,.12);--warn:#fbbf24;--err:#f87171;--ok:#4ade80;--chip:#1b2029}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.sub{color:var(--muted);font-size:12px}
main{padding:22px 24px 44px;max-width:1800px;margin:0 auto}
section{margin-bottom:26px}
h2{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
/* 概览固定三块（请求数 / 总 Token 数 / 缓存命中率），任何宽度下都排在同一行 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.cards{gap:10px}.card{padding:13px 14px 12px}.card .k{font-size:12px}.card .v{margin-top:10px;font-size:24px}.card .v small{font-size:12px}.card .s{font-size:11.5px;gap:3px 10px}.card .spark,.card .spark svg{height:28px}}
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,var(--accent)) 7%,var(--card)) 0,var(--card) 58%);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tint,var(--accent));opacity:.85}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .k{color:var(--muted);font-size:12.5px;font-weight:500}
.card .ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:color-mix(in srgb,var(--tint,var(--accent)) 18%,transparent);color:var(--tint,var(--accent))}
.card .v{margin-top:12px;font-size:30px;font-weight:680;letter-spacing:-.6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.card .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.card .s{margin-top:8px;margin-bottom:2px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
/* 折线图固定贴在卡片底部：三块的图因此落在同一水平线上 */
.card .spark{margin-top:auto;padding-top:12px;height:46px}
.card .spark svg{display:block;width:100%;height:34px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;transition:border-color .15s,background .15s}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input::placeholder{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:600}
.msg{color:var(--muted);padding:16px}
.hidden{display:none}
/* 标题旁的说明图标：悬停/聚焦时自己画气泡，不用原生 title（原生提示依赖浏览器
   的悬停时序，且没法排版多行说明） */
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;line-height:1;vertical-align:middle;cursor:help;user-select:none}
.info:hover,.info:focus{border-color:var(--accent);color:var(--accent)}
.info:focus{outline:none}
.tip{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:40;width:max-content;max-width:min(620px,86vw);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:12px;font-weight:400;line-height:1.7;letter-spacing:0;text-transform:none;text-align:left;white-space:pre-line;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.info:hover .tip,.info:focus .tip{display:block}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard .pk{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.pcard .pv{margin-top:8px;font-size:26px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pcard .pv small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.pcard .bar2{position:relative;height:8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin-top:10px;overflow:hidden}
.pcard .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.pcard .ps{margin-top:8px;color:var(--muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:3px 10px}
.plan-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:12.5px}
.plan-head select{padding:5px 9px;font-size:12.5px;border-radius:9px;max-width:100%}
.plan-warn{color:var(--warn)}
.plan-err{color:var(--err)}
/* 原始记录的翻页脚注：按钮可以点，滑到可见时也会自动取下一页（见 loadMoreRecords） */
.records-more{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0 2px}
.records-more button{padding:6px 14px;font-size:12.5px}
/* 时间线走势图：等宽 viewBox + width:100%，靠 CSS 变量取色，浅色/深色都跟着主题走 */
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.chart polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .s-requests{stroke:var(--accent)}
.chart .s-off{stroke:var(--err)}
.chart .s-failed{stroke:var(--warn)}
.chart .legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:4px;color:var(--muted);font-size:12px}
.chart .legend{display:inline-flex;align-items:center;gap:6px}
.chart .legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chart .sw-requests{background:var(--accent)}
.chart .sw-off{background:var(--err)}
.chart .sw-failed{background:var(--warn)}
.chart .dot-requests{fill:var(--accent)}
.chart .dot-off{fill:var(--err)}
.chart .dot-failed{fill:var(--warn)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 13px;text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--card) 84%,var(--bg));border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.empty-row td{text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Cline 渠道监控<span id="ver"></span></h1>
    <div class="sub" id="statusline">加载中…</div>
  </div>
  <div class="bar" style="margin:0">
    <select id="window">
      <option value="1h">近 1 小时</option>
      <option value="24h" selected>近 24 小时</option>
      <option value="7d">近 7 天</option>
    </select>
    <button id="refresh">刷新</button>
    <button id="forget" title="清除本机保存的管理密钥">清除密钥</button>
  </div>
</header>
<main>
  <section id="gate" class="hidden">
    <div class="card">
      <div class="top"><div class="k">需要 CPA 管理密钥（仅保存在本机浏览器，只用于调用本站管理接口）</div></div>
      <div class="bar" style="margin:12px 0 0">
        <input id="token" type="password" placeholder="粘贴 management key" size="46">
        <button class="primary" id="save">保存并加载</button>
      </div>
    </div>
  </section>

  <section id="plan-section">
    <h2>Cline 套餐用量（官方接口）</h2>
    <div class="plan-head">
      <select id="plan-account" class="hidden" title="按 Cline API Key / 账号切换官方数据（多凭据时显示）"></select>
      <span id="plan-head"></span>
    </div>
    <div class="plan" id="plan-cards"></div>
    <div class="msg hidden" id="plan-msg"></div>
  </section>

  <section id="channel-section">
    <h2 style="display:flex;align-items:center;gap:10px">渠道<span class="info" id="channel-info" tabindex="0" aria-describedby="channel-info-tip" aria-label="渠道口径说明">!<span class="tip" id="channel-info-tip" role="tooltip"></span></span><button id="channel-csv" style="margin-left:auto;padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none">导出 CSV</button></h2>
    <div class="msg hidden" id="channel-off"></div>
    <div class="msg hidden" id="channel-msg"></div>
    <div id="channel-data" class="hidden">
      <div class="sub" id="channel-headline" style="margin:-4px 0 10px"></div>
      <div class="sub" id="channel-note" style="margin:-4px 0 12px"></div>
      <div class="cards" id="channel-cards"></div>
      <div class="sub" id="channel-providers-note" style="margin:18px 0 8px;font-weight:600">真实渠道（网关 <code>finalProvider</code>，来自 CPA 请求日志）</div>
      <div class="wrap"><table id="channel-providers"><thead>
        <tr><th>真实渠道</th><th class="num">请求</th><th class="num">占比</th><th class="num">偏离</th><th class="num">失败</th><th class="num">TTFT p50</th><th class="num">TTFT p90</th><th class="num">解码 p50</th><th class="num">输入</th><th class="num">输出</th><th class="num">缓存</th></tr>
      </thead><tbody></tbody></table></div>
      <div class="sub" id="channel-timeline-note" style="margin:18px 0 8px;font-weight:600">时间线（每小时 · 最近 10 小时）</div>
      <div class="chart" id="channel-hour-chart"></div>
      <div class="wrap" style="margin-top:14px"><table id="channel-hours"><thead>
        <tr><th>时间（新 → 旧）</th><th class="num">请求</th><th class="num">偏离</th><th class="num">失败</th><th class="num">TTFT p50</th><th class="num">解码 p50</th></tr>
      </thead><tbody></tbody></table></div>
      <div class="sub" id="channel-records-note" style="margin:18px 0 8px;font-weight:600">原始记录</div>
      <div class="wrap"><table id="channel-records"><thead>
        <tr><th>时间</th><th>模型</th><th>真实渠道</th><th class="num">尝试</th><th>CPA 凭据</th><th class="num">失败</th><th class="num">TTFT</th><th class="num">解码 t/s</th><th class="num">输入/输出/缓存读</th><th class="num">状态</th><th>会话</th></tr>
      </thead><tbody></tbody></table></div>
      <div class="records-more hidden" id="channel-records-more">
        <button type="button" id="channel-records-load">加载更多</button>
        <span class="sub" id="channel-records-more-text"></span>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
"use strict";
const BASE="/v0/management/plugins/clinepass-channel-monitor";
const TOKEN_KEY="cpm-management-key";
const store={
  get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function n(v){return v==null?0:Number(v)||0}
function int(v){return v==null?"-":Math.round(n(v)).toLocaleString("zh-CN")}
function fixed(v,d){return v==null?"-":n(v).toFixed(d==null?2:d)}
// 千位以上转 K/M/B/T（B = billion = 十亿），保留两位小数
function scaled(v){
  const x=n(v);
  if(Math.abs(x)>=1e12)return (x/1e12).toFixed(2)+"T";
  if(Math.abs(x)>=1e9)return (x/1e9).toFixed(2)+"B";
  if(Math.abs(x)>=1e6)return (x/1e6).toFixed(2)+"M";
  if(Math.abs(x)>=1e3)return (x/1e3).toFixed(2)+"K";
  return String(Math.round(x));
}
function fmtTime(ts){if(!ts)return "-";const d=new Date(ts);if(isNaN(d))return ts;const p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
// 官方区间有时是空的（还没取到汇总），此时不要渲染出一个空的 "~"。
// 只到天：订阅周期用得上，不需要时分秒
function fmtDate(ts){if(!ts)return "";const d=new Date(ts);if(isNaN(d))return String(ts).slice(0,10);const p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}

async function api(path){
  const url=new URL(BASE+path,location.origin);
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+store.get(TOKEN_KEY)},cache:"no-store"});
  if(res.status===401||res.status===403){const e=new Error("unauthorized");e.code=res.status;throw e}
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}

// 迷你折线图（内联 SVG，无外部依赖）
function sparkline(values,color){
  const series=(values||[]).map(v=>n(v));
  if(series.length<2)return "";
  const w=240,h=34,pad=3;
  const max=Math.max.apply(null,series),min=Math.min.apply(null,series);
  const span=max-min||1;
  const step=(w-pad*2)/(series.length-1);
  const pts=series.map((v,i)=>[pad+i*step,pad+(h-pad*2)*(1-(v-min)/span)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+(pad+(series.length-1)*step).toFixed(1)+" "+(h-pad)+" L"+pad+" "+(h-pad)+" Z";
  const gid="sg"+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    "</linearGradient></defs>"+
    '<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    "</svg>";
}

function card(opt){
  const tint=opt.tint||"var(--accent)";
  return '<div class="card" style="--tint:'+tint+'" title="'+esc(opt.tip||"")+'">'+
    '<div class="top"><div class="k">'+esc(opt.label)+'</div><div class="ico">'+esc(opt.icon||"")+"</div></div>"+
    '<div class="v">'+esc(opt.value)+(opt.unit?'<small>'+esc(opt.unit)+"</small>":"")+"</div>"+
    (opt.sub&&opt.sub.length?'<div class="s">'+opt.sub.map(x=>"<span>"+esc(x)+"</span>").join("")+"</div>":"")+
    (opt.spark?'<div class="spark">'+sparkline(opt.spark,tint)+"</div>":"")+
    "</div>";
}

// 一个 CPA 里可能配置了多个 Cline 条目或多把 key，每把 key 对应一个 Cline 账号：
// 官方套餐/限额/用量都是按账号（key）分开的，所以页面顶部有一个账号下拉。
const PLAN_ACCOUNT_KEY="cpm-plan-account";
let planSnapshot=null;

function planAccountList(plan){
  const all=(plan&&plan.accounts)||[];
  if(!all.length)return plan?[plan]:[];
  // 上游拒绝的凭据（401/403，例如把下游客户端 key 当成了 Cline key）不进下拉，
  // 否则会出现一个永远不可用的账号；/health 的 plan_accounts 里仍能看到它。
  return all.filter(a=>a&&a.rejected!==true);
}

function planIgnoredCount(plan){
  const all=(plan&&plan.accounts)||[];
  return Math.max(0,all.length-planAccountList(plan).length);
}

function selectedPlanAccount(plan){
  const list=planAccountList(plan);
  if(!list.length)return plan||null;
  const want=store.get(PLAN_ACCOUNT_KEY);
  let account=list.filter(a=>a&&a.id===want)[0];
  if(!account)account=list.filter(a=>a&&a.available)[0]||list[0];
  return account;
}

function renderAccountPicker(picker,list){
  if(!picker)return;
  if(list.length<2){picker.innerHTML="";picker.classList.add("hidden");return}
  const current=(selectedPlanAccount(planSnapshot)||{}).id||"";
  picker.innerHTML=list.map(function(account){
    const label=(account.label||account.id||"账号")+(account.available===false?"（不可用）":"");
    return '<option value="'+esc(account.id||"")+'"'+(account.id===current?" selected":"")+">"+esc(label)+"</option>";
  }).join("");
  picker.classList.remove("hidden");
}

function quotaTint(pct){if(pct>=90)return "#f87171";if(pct>=70)return "#fbbf24";return "#34d399"}

function renderPlan(plan){
  planSnapshot=plan;
  const head=$("plan-head"), cards=$("plan-cards"), msg=$("plan-msg"), picker=$("plan-account");
  const list=planAccountList(plan);
  renderAccountPicker(picker,list);
  const view=selectedPlanAccount(plan);
  if(!view||view.available===false){
    cards.innerHTML="";
    head.innerHTML="";
    msg.classList.remove("hidden");
    msg.className="msg plan-err";
    const error=(view&&view.error)||(plan&&plan.error)||"";
    if(error.indexOf("no Cline api key")>=0){
      msg.innerHTML='未取到官方用量：插件拿不到 Cline API Key。'+
        '插件会自动读取 CPA 自己的 Cline 凭据，通常不需要配置：确认 CPA 里有 Cline 供应商条目'+
        '（<code>openai-compatibility</code>，条目名是 <code>Cline</code> 或 base-url 命中插件配置的 <code>hosts</code>），'+
        '并确认 <code>plan_config_path</code> 指向容器内可读的 config.yaml。'+
        '<br>读取顺序：CPA config.yaml（<code>openai-compatibility[].api-key-entries</code>）→ CPA 凭据接口。';
    }else if(list.length>1&&error){
      msg.textContent="该账号官方用量暂不可用（"+(view.label||"")+"）："+error;
    }else{
      msg.textContent=error?("未取到官方用量："+error):"官方用量暂不可用。";
    }
    return;
  }
  msg.classList.add("hidden");
  const bits=[];
  if(list.length>1)bits.push(list.length+" 个 Cline 凭据");
  if(planIgnoredCount(plan))bits.push('<span class="plan-warn">已忽略 '+planIgnoredCount(plan)+" 个无效凭据</span>");
  if(view.plan_name)bits.push('<span class="chip">'+esc(view.plan_name)+"</span>");
  if(view.plan_price)bits.push(esc(view.plan_price));
  if(view.account)bits.push("账号 "+esc(view.account));
  if(view.fetched_at)bits.push("套餐更新于 "+esc(fmtTime(view.fetched_at).slice(11,19)));
  if(view.plan_interval)bits.push(esc(view.plan_interval));
  const periodStart=fmtDate(view.plan_period_start), periodEnd=fmtDate(view.plan_period_end);
  if(periodStart&&periodEnd)bits.push("周期 "+esc(periodStart)+" ~ "+esc(periodEnd));
  // canceledAt 有值说明这个订阅已经取消，但当前周期结束前仍然有效。
  if(view.plan_canceled_at)bits.push('<span class="plan-warn">已取消'+(periodEnd?"，"+esc(periodEnd)+" 到期":"")+"</span>");
  if(view.tokens_error)bits.push('<span class="plan-warn">官方汇总未取到：'+esc(view.tokens_error)+"</span>");
  if(view.usage&&view.usage.error)bits.push('<span class="plan-warn">官方逐条用量刷新失败：'+esc(view.usage.error)+"</span>");
  head.innerHTML=bits.join(" · ");

  const blocks=(view.limits||[]).map(function(limit){
    const pct=n(limit.percent_used);
    const warn=pct>=90?" plan-warn":"";
    return '<div class="pcard">'+
      '<div class="pk"><span>'+esc(limit.label||limit.type)+'</span><span class="'+warn.trim()+'">'+fixed(pct,0)+'%</span></div>'+
      '<div class="pv">'+fixed(pct,1)+'<small>% 已用</small></div>'+
      '<div class="bar2"><i style="width:'+fixed(Math.min(100,pct),1)+'%;background:'+quotaTint(pct)+'"></i></div>'+
      '<div class="ps"><span>剩余 '+fixed(100-pct,1)+'%</span><span>重置 '+(limit.resets_in?esc(limit.resets_in):"—")+"</span></div>"+
      '<div class="ps"><span>'+esc(limit.resets_at?fmtTime(limit.resets_at):"")+"</span></div>"+
      "</div>";
  }).join("");

  const tok=view.tokens||{};
  const bals=[];
  if(tok.balance_usd)bals.push("余额 $"+fixed(tok.balance_usd,4));
  if(tok.cost_usd)bals.push("近 31 天成本 $"+fixed(tok.cost_usd,4));
  if(tok.requests)bals.push("官方计费条目 "+int(tok.requests));
  const tokenCard=tok.total_tokens?'<div class="pcard">'+
      '<div class="pk"><span>近 31 天已用 Token（官方）</span></div>'+
      '<div class="pv">'+scaled(tok.total_tokens)+'<small>token</small></div>'+
      '<div class="ps"><span>'+esc((tok.from_date||"")+" ~ "+(tok.to_date||""))+'</span></div>'+
      '<div class="ps"><span>输入 '+scaled(tok.input_tokens)+"</span><span>输出 "+scaled(tok.output_tokens)+"</span></div>"+
      '<div class="ps">'+bals.map(b=>"<span>"+esc(b)+"</span>").join("")+"</div>"+
      "</div>":"";
  cards.innerHTML=blocks+tokenCard;
}

function windowLabel(w){return w==="1h"?"近 1 小时":w==="7d"?"近 7 天":"近 24 小时"}

// --- 渠道观测（GET /channel）--------------------------------------------------
// 这一块只回答一个问题：窗口内的 clinepass 请求里有多少比例没落在基准渠道。先给结论
// （headline + 卡片），再拆到渠道、模型、小时与原始记录；原始记录是给上面每个数字做
// 抽查用的。非基线渠道只做标记、不隐藏——把它们藏起来才是最容易看错的口径。

function channelBaselineName(summary){
  const name=String((summary&&summary.baseline_provider)||"").trim();
  return name||"默认渠道";
}

function pctText(ratio){return fixed(n(ratio)*100,2)+"%"}

function msText(value){return n(value)>0?fixed(value,0)+" ms":"—"}

function tpsText(value){return n(value)>0?fixed(value,1):"—"}

// 小时点是 RFC3339，表格里只需要到小时。
function fmtHour(value){
  const date=new Date(value);
  if(isNaN(date))return value==null?"—":String(value);
  const p=x=>String(x).padStart(2,"0");
  return p(date.getMonth()+1)+"-"+p(date.getDate())+" "+p(date.getHours())+":00";
}

// 一条记录落在哪个渠道：finalProvider 优先，只有 resolvedProvider 时退回它。
function channelOfRecord(record){
  const final=String((record&&record.final_provider)||"").trim();
  if(final)return final;
  return String((record&&record.resolved_provider)||"").trim();
}

function channelIsOff(record,baseline){
  const provider=channelOfRecord(record);
  if(!provider||!baseline)return false;
  return provider.toLowerCase()!==baseline.toLowerCase();
}

function shortID(value){
  const text=String(value==null?"":value);
  if(!text)return "—";
  return text.length>14?text.slice(0,14)+"…":text;
}

// 下载文件名优先用服务端给的 Content-Disposition，拿不到再退回本地拼的名字。
function filenameFromDisposition(value){
  const header=String(value==null?"":value);
  const quoted=header.match(/filename\s*=\s*"([^"]+)"/i);
  if(quoted&&quoted[1])return quoted[1];
  const bare=header.match(/filename\s*=\s*([^;]+)/i);
  if(bare&&bare[1])return bare[1].trim();
  return "";
}

// 未开启时要说清"没有记录"而不是显示一排 0，并且把开关的名字和目录一起给出。
function renderChannelOff(health){
  const box=$("channel-off");
  if(!box)return;
  const directory=health&&health.directory?String(health.directory):"";
  box.className="msg";
  box.innerHTML="<strong>渠道观测未开启</strong>：配置项 <code>channel_observe_enabled</code> 为 false 时插件不声明 usage 钩子，"+
    "这里没有记录可显示（不是 0，是没有数据）。"+
    (directory?"记录目录 <code>"+esc(directory)+"</code>。":"")+
    "把它设为 true 并重载插件后，本区开始统计偏离基准渠道的比例。";
  box.classList.remove("hidden");
}

function renderChannelProviders(summary,baseline){
  const body=$("channel-providers").querySelector("tbody");
  const rows=(summary&&summary.providers)||[];
  if(!rows.length){
    body.innerHTML='<tr class="empty-row"><td colspan="11">该窗口还没有渠道数据：窗口内没有流量，或者采集器未运行。</td></tr>';
    return;
  }
  body.innerHTML=rows.map(function(row){
    const provider=String(row.provider||"");
    const isBaseline=provider.toLowerCase()===baseline.toLowerCase();
    const off=n(row.off_baseline);
    return "<tr>"+
      '<td><span class="mono">'+esc(provider||"—")+"</span>"+
        (isBaseline?'<span class="chip" style="margin-left:6px">基准</span>':"")+
        (off>0?'<span class="plan-warn" style="margin-left:6px">偏离</span>':"")+"</td>"+
      '<td class="num">'+int(row.requests)+"</td>"+
      '<td class="num">'+pctText(row.ratio)+"</td>"+
      '<td class="num">'+int(row.off_baseline)+"</td>"+
      '<td class="num">'+(n(row.failed)>0?'<span class="plan-warn">'+int(row.failed)+"</span>":"0")+"</td>"+
      '<td class="num">'+msText(row.ttft_p50_ms)+"</td>"+
      '<td class="num">'+msText(row.ttft_p90_ms)+"</td>"+
      '<td class="num">'+tpsText(row.decode_p50_tps)+"</td>"+
      '<td class="num">'+scaled(row.input_tokens)+"</td>"+
      '<td class="num">'+scaled(row.output_tokens)+"</td>"+
      '<td class="num">'+scaled(row.cached_tokens)+"</td>"+
      "</tr>";
  }).join("");
}

// 时间线只覆盖最近 10 个小时：窗口（1h/24h/7d）仍然是上面所有汇总数字的范围，这一块
// 只回答「刚刚过去的十个小时是什么样」，更早的小时去「真实渠道」表和 CSV 里看。
const timelineHourLimit=10;

// newestChannelHours 取窗口里最新的若干个小时点，顺序保持旧 → 新（sparkline 的方向不变）。
function newestChannelHours(summary){
  const hours=(summary&&summary.hours)||[];
  return hours.length>timelineHourLimit?hours.slice(hours.length-timelineHourLimit):hours.slice();
}

// 时间线原来用两张 sparkline 卡片；现在换成一张三条线的走势图（请求 / 偏离 / 失败）。
// 精确值仍然看下方的小时表：图给趋势，表给数字，两边读同一份 newestChannelHours()，
// 所以不会出现图上有点、表里少一行的情况。
function renderChannelHourChart(summary){
  const box=$("channel-hour-chart");
  if(!box)return;
  const hours=newestChannelHours(summary);
  if(!hours.length){
    box.innerHTML='<div class="msg">该窗口没有小时数据。</div>';
    return;
  }
  const series=[
    {name:"requests",label:"请求",values:hours.map(function(point){return n(point.requests)})},
    {name:"off",label:"偏离",values:hours.map(function(point){return n(point.off_baseline)})},
    {name:"failed",label:"失败",values:hours.map(function(point){return n(point.failed)})}
  ];
  // 固定 viewBox + width:100%，横纵都不拉伸：图随卡片宽度等比缩放，坐标文字不会变形。
  const width=1000,height=240,left=54,right=18,top=18,bottom=42;
  const plotWidth=width-left-right,plotHeight=height-top-bottom;
  let max=1;
  series.forEach(function(line){line.values.forEach(function(value){if(value>max)max=value})});
  const xAt=function(index){return hours.length<=1?left+plotWidth/2:left+index*plotWidth/(hours.length-1)};
  const yAt=function(value){return top+(1-value/max)*plotHeight};
  const grid=[0,0.5,1].map(function(ratio){
    const y=yAt(max*ratio);
    return '<line class="grid" x1="'+left+'" y1="'+fixed(y,1)+'" x2="'+(width-right)+'" y2="'+fixed(y,1)+'"></line>'+
      '<text class="axis" x="'+(left-10)+'" y="'+fixed(y,1)+'" text-anchor="end" dominant-baseline="middle">'+int(max*ratio)+"</text>";
  }).join("");
  const hourTicks=hours.map(function(point,index){
    // 10 个点全标会挤在一起，隔一个标一个；表格里每个小时都有。
    if(hours.length>6&&index%2!==0)return "";
    return '<text class="axis" x="'+fixed(xAt(index),1)+'" y="'+(height-bottom+22)+'" text-anchor="middle">'+esc(fmtHour(point.hour).slice(6))+"</text>";
  }).join("");
  const lines=series.map(function(line){
    const points=line.values.map(function(value,index){return fixed(xAt(index),1)+","+fixed(yAt(value),1)}).join(" ");
    const dots=line.values.map(function(value,index){
      return '<circle class="dot-'+line.name+'" cx="'+fixed(xAt(index),1)+'" cy="'+fixed(yAt(value),1)+'" r="2.8">'+
        "<title>"+esc(fmtHour(hours[index].hour)+" · "+line.label+" "+int(value))+"</title></circle>";
    }).join("");
    return '<polyline class="s-'+line.name+'" points="'+points+'"></polyline>'+dots;
  }).join("");
  const legend=series.map(function(line){
    return '<span class="legend"><i class="sw-'+line.name+'"></i>'+esc(line.label)+"</span>";
  }).join("");
  box.innerHTML='<div class="legend-row">'+legend+'<span style="margin-left:auto">最近 '+int(hours.length)+" 个小时</span></div>"+
    '<svg viewBox="0 0 '+width+" "+height+'" role="img" aria-label="'+esc("最近 "+hours.length+" 小时的请求、偏离与失败走势")+'">'+
    grid+hourTicks+lines+"</svg>";
}

function renderChannelHours(summary){
  const body=$("channel-hours").querySelector("tbody");
  const hours=newestChannelHours(summary);
  if(!hours.length){
    body.innerHTML='<tr class="empty-row"><td colspan="6">该窗口没有小时数据。</td></tr>';
    return;
  }
  // 最新的一小时排在最上面：最近 10 个整点刻度从窗口末端往回列，用户先看到「刚刚过去的一小时」。
  // 用 slice() 复制后再 reverse，避免把 summary.hours 原地倒过来影响同一份 summary 的其它渲染
  // （上面三张 sparkline 卡片仍按时间正序画，左旧右新，图表趋势方向不变）。
  body.innerHTML=hours.slice().reverse().map(function(point){
    const off=n(point.off_baseline);
    return "<tr>"+
      "<td>"+esc(fmtHour(point.hour))+"</td>"+
      '<td class="num">'+int(point.requests)+"</td>"+
      '<td class="num">'+(off>0?'<span class="plan-warn">'+int(off)+"</span>":int(off))+"</td>"+
      '<td class="num">'+(n(point.failed)>0?'<span class="plan-warn">'+int(point.failed)+"</span>":"0")+"</td>"+
      '<td class="num">'+msText(point.ttft_p50_ms)+"</td>"+
      '<td class="num">'+tpsText(point.decode_p50_tps)+"</td>"+
      "</tr>";
  }).join("");
}

// 原始记录分页：每页 20 条，往下滑到脚注时自动取下一页；按钮走的是同一条路径，键盘和
// 不支持 IntersectionObserver 的浏览器靠它。分页只覆盖这张表，CSV 仍然是完整窗口。
const recordsPageSize=20;
// recordsMaxDepth 对应后端的 channelRecordMaxLimit：60 秒自动刷新时最多按这个深度重取一页，
// 免得把用户翻到的位置弹回第一页，也不会让一次请求变得过大。
const recordsMaxDepth=200;
let recordsState={window:"",baseline:"",rows:[],total:0,loading:false};
let recordsObserver=null;

function resetRecordsState(){
  recordsState={window:$("window").value||"24h",baseline:"",rows:[],total:0,loading:false};
}

function recordsDepth(){
  return Math.max(recordsPageSize,Math.min(recordsState.rows.length||recordsPageSize,recordsMaxDepth));
}

function recordRow(record,baseline){
    const provider=channelOfRecord(record);
    const off=channelIsOff(record,baseline);
    const authIndex=String(record.auth_index||"");
    const cpa=String(record.cpa_provider||"");
    const resolved=String(record.gateway_resolved_provider||"");
    const attempts=n(record.gateway_attempts);
    // A request whose log carried no routing block (typically a failure) has no real channel to
    // show: "无渠道块" is the honest cell, and it is not the same thing as the baseline.
    const channelCell=provider
      ? (off?'<span class="plan-warn" style="font-weight:600">':"")+esc(provider)+(off?"（偏离）</span>":'<span class="chip" style="margin-left:6px">基准</span>')
      : '<span class="sub">无渠道块</span>';
    return "<tr>"+
      "<td>"+esc(fmtTime(record.time))+"</td>"+
      '<td><span class="mono">'+esc(record.model||"—")+"</span>"+
        (record.upstream_model?'<div class="sub" style="margin-top:2px">'+esc(record.upstream_model)+"</div>":"")+"</td>"+
      "<td>"+channelCell+
        (resolved&&resolved!==provider?'<div class="sub" style="margin-top:2px">resolved '+esc(resolved)+"</div>":"")+"</td>"+
      '<td class="num">'+(attempts?int(attempts):"—")+"</td>"+
      "<td>"+(cpa?'<span class="mono">'+esc(cpa)+"</span>":'<span class="mono">—</span>')+
        (authIndex?'<div class="sub" style="margin-top:2px">索引 '+esc(authIndex)+"</div>":"")+"</td>"+
      '<td class="num">'+(record.failed?'<span class="plan-warn">失败</span>':"否")+"</td>"+
      '<td class="num">'+msText(record.ttft_ms)+"</td>"+
      '<td class="num">'+tpsText(record.tokens_per_second)+"</td>"+
      '<td class="num">'+scaled(record.input_tokens)+" / "+scaled(record.output_tokens)+" / "+
        scaled(record.cache_read_tokens||record.cached_tokens)+"</td>"+
      '<td class="num">'+int(record.status_code)+
        (record.stream===false?'<span class="sub" style="margin-left:6px">非流式</span>':"")+"</td>"+
      '<td title="'+esc(record.session_id||"")+'"><span class="mono">'+esc(shortID(record.session_id))+"</span></td>"+
      "</tr>";
}

function paintRecordsNote(){
  const note=$("channel-records-note");
  if(!note)return;
  const shown=recordsState.rows.length,total=recordsState.total;
  note.innerHTML="原始记录"+(shown<total
    ?" · 已显示 "+int(shown)+" / 共 "+int(total)+" 条（导出 CSV 是完整窗口）"
    :" · 共 "+int(total)+" 条");
}

function paintRecordsMore(){
  const box=$("channel-records-more"),button=$("channel-records-load"),text=$("channel-records-more-text");
  if(!box||!button||!text)return;
  const remaining=recordsState.total-recordsState.rows.length;
  box.classList.toggle("hidden",remaining<=0);
  button.disabled=recordsState.loading;
  button.textContent=recordsState.loading?"加载中…":"加载更多";
  text.textContent=remaining>0?("还有 "+int(remaining)+" 条 · 滑到底部自动加载"):"";
}

function paintRecords(){
  const body=$("channel-records").querySelector("tbody");
  body.innerHTML=recordsState.rows.length
    ? recordsState.rows.map(record=>recordRow(record,recordsState.baseline)).join("")
    : '<tr class="empty-row"><td colspan="11">该窗口没有原始记录。</td></tr>';
  paintRecordsNote();
  paintRecordsMore();
}

function renderChannelRecords(view,baseline){
  recordsState={
    window:$("window").value||"24h",
    baseline:baseline,
    rows:((view&&view.records)||[]).slice(),
    total:n(view&&view.records_total),
    loading:false};
  paintRecords();
  observeRecordsMore();
}

// 脚注进入视口时取下一页：这就是「下滑翻页」。观察器只负责触发，取数、去重和按钮状态
// 都在 loadMoreRecords 里；取完之后如果脚注被内容顶出视口，会等下一次滚动再触发。
function observeRecordsMore(){
  const box=$("channel-records-more");
  if(!box||typeof IntersectionObserver!=="function")return;
  if(recordsObserver)recordsObserver.disconnect();
  recordsObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting)return;
      if(recordsState.rows.length>=recordsState.total)return;
      loadMoreRecords();
    });
  },{rootMargin:"160px 0px"});
  recordsObserver.observe(box);
}

async function loadMoreRecords(){
  if(recordsState.loading)return;
  if(recordsState.rows.length>=recordsState.total)return;
  const win=recordsState.window||$("window").value||"24h";
  recordsState.loading=true;
  paintRecordsMore();
  try{
    const data=await api("/channel?window="+encodeURIComponent(win)+"&records="+recordsPageSize+"&offset="+recordsState.rows.length);
    // 期间切了窗口（或又刷新了一轮）就丢掉这一页：offset 属于上一份列表。
    if(win!==recordsState.window)return;
    const page=(data&&data.records)||[];
    recordsState.rows=recordsState.rows.concat(page);
    recordsState.total=n(data&&data.records_total)||recordsState.total;
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
      return;
    }
    const msg=$("channel-msg");
    if(msg){
      msg.className="msg plan-err";
      msg.textContent="原始记录加载失败："+err.message;
      msg.classList.remove("hidden");
    }
  }finally{
    recordsState.loading=false;
    paintRecords();
  }
}

function renderChannel(view){
  const data=view||{};
  const summary=data.summary||{};
  const health=data.health||summary.health||{};
  const enabled=data.enabled===true;
  const msg=$("channel-msg");
  if(msg){msg.className="msg hidden";msg.textContent=""}
  $("channel-off").classList.toggle("hidden",enabled);
  $("channel-data").classList.toggle("hidden",!enabled);
  if(!enabled){
    renderChannelOff(health);
    return;
  }

  const baseline=channelBaselineName(summary);
  const win=windowLabel(String(summary.window||$("window").value||"24h"));
  const resolved=n(summary.resolved_requests);
  const offCount=n(summary.off_baseline_requests);

  const unresolved=n(summary.unresolved_requests);
  const headline="<strong>过去 "+esc(win.replace("近",""))+"</strong>共 <strong>"+int(resolved+unresolved)+
    "</strong> 条请求，其中 <strong>"+int(offCount)+"</strong> 条的网关渠道不是 <strong>"+esc(baseline)+
    '</strong>，占能判定渠道的 <strong>'+int(resolved)+
    '</strong> 条的 <span class="chip">'+esc(resolved>0?pctText(summary.off_baseline_ratio):"—")+"</span>。";
  const headlineBits=[headline];
  if(unresolved>0)headlineBits.push('<span class="plan-warn">另有 '+int(unresolved)+" 条没有渠道块（失败的请求上游不返回路由块，或客户端没送 Session_id），不计入比例。</span>");
  if(!resolved)headlineBits.push('<span class="plan-warn">该窗口还没有能判定渠道的请求，因此比例不可用。</span>');
  $("channel-headline").innerHTML=headlineBits.join(" ");

  const hourList=summary.hours||[];
  const noteBits=[
    "窗口 "+(summary.from?esc(fmtTime(summary.from).slice(5,16)):"—")+" ~ "+(summary.to?esc(fmtTime(summary.to).slice(5,16)):"—"),
    "生成于 "+(summary.generated_at?esc(fmtTime(summary.generated_at).slice(11,19)):"—"),
    "渠道数 "+int(summary.channels),
    "已写入 "+int(health.written)+" 条"
  ];
  if(n(health.queued))noteBits.push("待写 "+int(health.queued));
  if(n(health.events))noteBits.push("收到 " + int(health.events) + " 条 usage");
  if(n(health.failed_events))noteBits.push('<span class="plan-warn">上游失败 '+int(health.failed_events)+"</span>");
  if(n(health.dropped))noteBits.push('<span class="plan-warn">队列丢弃 '+int(health.dropped)+"</span>");
  if(n(health.write_failures))noteBits.push('<span class="plan-warn">写入失败 '+int(health.write_failures)+"</span>");
  if(n(health.decode_failures))noteBits.push('<span class="plan-warn">解析失败 '+int(health.decode_failures)+"</span>");
  if(health.warmup&&n(health.warmup.records))noteBits.push("重载回填 "+int(health.warmup.records)+" 条"+(health.warmup.truncated?"（已截断）":""));
  if(health.last_write_at)noteBits.push("最后写入 "+esc(fmtTime(health.last_write_at).slice(11,19)));
  if(health.directory)noteBits.push("记录目录 "+esc(String(health.directory)));
  if(health.enabled===false)noteBits.push('<span class="plan-warn">采集器未运行</span>');
  if(health.last_error)noteBits.push('<span class="plan-warn">最近错误：'+esc(health.last_error)+"</span>");
  if(health.last_decode_error)noteBits.push('<span class="plan-warn">最近解析错误：'+esc(health.last_decode_error)+"</span>");
  $("channel-note").innerHTML=noteBits.join(" · ");

  const hourRequests=hourList.map(function(point){return n(point.requests)});
  const hourOffs=hourList.map(function(point){return n(point.off_baseline)});
  // 缓存命中率是本地口径：只用插件自己记录下来的请求算，窗口内缓存读 / 输入。官方逐条
  // 用量不再拉取，所以它不依赖 Cline 的接口，也不受官方限流与覆盖范围影响。
  const inputTokens=n(summary.input_tokens),cachedTokens=n(summary.cached_tokens);
  const cacheRatio=inputTokens>0?cachedTokens/inputTokens:0;
  $("channel-cards").innerHTML=[
    card({label:"请求数",icon:"⇄",tint:"#60a5fa",
      tip:"窗口内 CPA 服务过的请求数（一条 usage 记录算一条）。渠道来自 CPA 自己的请求日志，只有它能给出网关级的 finalProvider。",
      value:int(resolved+unresolved),unit:"条",
      sub:[(unresolved?("无渠道块 "+int(unresolved)+" 条"):"全部请求都有渠道块"),
           (n(summary.failed_requests)?("失败 "+int(summary.failed_requests)+" 条"):"窗口内无失败记录")],
      spark:hourRequests}),
    card({label:"偏离基准渠道",icon:"!",tint:"#f87171",
      tip:"网关渠道不是「"+baseline+"」的请求数与占比；分母是能判定渠道（日志里有路由块且 Session_id 对得上）的请求数。",
      value:int(offCount),unit:"条",
      sub:["占比 "+(resolved>0?pctText(summary.off_baseline_ratio):"—")+"（分母 "+int(resolved)+" 条）","基准渠道 "+baseline],
      spark:hourOffs}),
    card({label:"缓存命中率",icon:"%",tint:"#34d399",
      tip:"本地口径：窗口内缓存读 tokens / 输入 tokens，只用插件记录下来的请求算，不依赖 Cline 官方接口，因此是「最近的本地数据」。",
      value:inputTokens>0?fixed(cacheRatio*100,2):"—",unit:"%",
      sub:["缓存读 "+scaled(cachedTokens)+" / 输入 "+scaled(inputTokens)]})
  ].join("");

  renderChannelProviders(summary,baseline);
  renderChannelHourChart(summary);
  renderChannelHours(summary);
  renderChannelRecords(data,baseline);

  const tip=$("channel-info-tip");
  if(tip){
    tip.textContent=[
      "「真实渠道」= Cline 网关实际服务的渠道（finalProvider），来自 CPA 自己的请求日志里上游响应的 provider_metadata.gateway.routing；「CPA 凭据」= 这条请求用了哪把 key（usage 回调给出）。两者分列，不能互相替代。",
      "只有日志里有路由块、且 Session_id 与 usage 记录对得上的请求才有真实渠道（实测偏移 72–218 ms，窗口 2 秒）；失败的请求上游不返回路由块，所以它们的渠道列显示「无渠道块」，不计入偏离比例。",
      "「偏离基准渠道」= 真实渠道不等于 " + baseline + " 的请求数；占比 = 偏离数 / 能判定渠道的请求数。",
      "TTFT 与延时来自 CPA 的 usage 记录（纳秒转毫秒）；解码速度 = 输出 token / （总延时 − TTFT），窗口短于 50ms 时不记速度。",
      "「失败」= CPA 的 usage 记录里 Failed 为真的请求（当前实测全部是上游 502），按本窗口的记录计数，与页顶进程计数器无关。",
      "失败（failed）是上游执行失败，状态码取自 usage 记录的 Failure.StatusCode；小时表保留窗口内每个小时，空小时按 0 显示，不做插值。",
      "原始记录只带最新 20 条，完整数据走 CSV 导出。"
    ].join("\n");
  }
}

function renderChannelError(err){
  const msg=$("channel-msg");
  if(msg){
    msg.className="msg plan-err";
    msg.textContent="渠道数据加载失败："+((err&&err.message)?err.message:String(err||""));
    msg.classList.remove("hidden");
  }
  $("channel-data").classList.add("hidden");
  $("channel-off").classList.add("hidden");
}

// 渠道视图按窗口在服务端聚合，所以改窗口要重新取一次，不能只用本地快照重画。
async function loadChannel(){
  const win=$("window").value||"24h";
  try{
    // 已经翻到的深度跟着刷新一起带上：自动刷新不会把用户翻到的那几页弹回第一页。
    const view=await api("/channel?window="+encodeURIComponent(win)+"&records="+recordsDepth());
    // 期间改过窗口，这份数据属于上一份列表，画上去会让表头和内容对不上。
    if(win!==($("window").value||"24h"))return;
    renderChannel(view);
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
      return;
    }
    renderChannelError(err);
  }
}

// /channel.csv 也要 Bearer 头，所以不能用 <a href>：先取 Blob，再用一个临时链接触发下载。
async function downloadChannelCSV(){
  const button=$("channel-csv");
  const win=$("window").value||"24h";
  const label=button?button.textContent:"";
  if(button){button.disabled=true;button.textContent="导出中…"}
  try{
    const url=new URL(BASE+"/channel.csv?window="+encodeURIComponent(win),location.origin);
    const res=await fetch(url,{headers:{"Authorization":"Bearer "+store.get(TOKEN_KEY)},cache:"no-store"});
    if(res.status===401||res.status===403){const e=new Error("unauthorized");e.code=res.status;throw e}
    if(!res.ok)throw new Error("HTTP "+res.status);
    const blob=await res.blob();
    const name=filenameFromDisposition(res.headers.get("Content-Disposition"))||("channel-observation-"+win+".csv");
    const href=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=href;
    link.download=name;
    document.body.appendChild(link);
    link.click();
    if(link.parentNode)link.parentNode.removeChild(link);
    setTimeout(function(){URL.revokeObjectURL(href)},1000);
    const count=res.headers.get("X-Record-Count");
    const msg=$("channel-msg");
    if(msg){
      msg.className="msg";
      msg.textContent="已导出 "+(count==null?"":count+" 条记录 · ")+name;
      msg.classList.remove("hidden");
    }
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
    }
    const msg=$("channel-msg");
    if(msg){
      msg.className="msg plan-err";
      msg.textContent="导出 CSV 失败："+err.message;
      msg.classList.remove("hidden");
    }
  }finally{
    if(button){button.disabled=false;button.textContent=label||"导出 CSV"}
  }
}

async function load(){
  loadChannel();
  try{
    const health=await api("/health");
    $("ver").textContent="v"+health.version;
    const bits=["运行 "+esc(health.uptime||"-")];
    if(health.plan_enabled===false)bits.push('<span class="plan-warn">套餐轮询未启用</span>');
    if(health.plan_usage&&health.plan_usage.enabled)bits.push("官方逐条用量已启用");
    $("statusline").innerHTML=bits.join(" · ");
    renderPlan(health.plan);
    $("gate").classList.add("hidden");
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
    }else{
      $("statusline").textContent="加载失败："+err.message;
    }
  }
}

$("save").addEventListener("click",()=>{const v=$("token").value.trim();if(!v)return;store.set(TOKEN_KEY,v);load()});
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
$("forget").addEventListener("click",()=>{store.del(TOKEN_KEY);$("token").value="";$("gate").classList.remove("hidden");$("statusline").textContent="已清除本机保存的密钥"});
$("refresh").addEventListener("click",()=>load());
$("window").addEventListener("change",()=>{resetRecordsState();loadChannel()});
$("channel-csv").addEventListener("click",()=>downloadChannelCSV());
$("channel-records-load").addEventListener("click",()=>loadMoreRecords());
$("plan-account").addEventListener("change",()=>{store.set(PLAN_ACCOUNT_KEY,$("plan-account").value);renderPlan(planSnapshot||{})});

if(!store.get(TOKEN_KEY))$("gate").classList.remove("hidden");
load();
setInterval(()=>{if(store.get(TOKEN_KEY))load()},60000);
})();
</script>
