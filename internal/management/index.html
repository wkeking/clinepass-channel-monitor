<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cline 渠道监控</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#15171c;--muted:#6a7280;--line:#e5e8ec;--accent:#2563eb;--accent-soft:rgba(37,99,235,.08);--warn:#b45309;--err:#b91c1c;--ok:#15803d;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#14181f;--fg:#e9ecf1;--muted:#8b95a5;--line:#222833;--accent:#60a5fa;--accent-soft:rgba(96,165,250,.12);--warn:#fbbf24;--err:#f87171;--ok:#4ade80;--chip:#1b2029}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.sub{color:var(--muted);font-size:12px}
main{padding:22px 24px 44px;max-width:1800px;margin:0 auto}
section{margin-bottom:26px}
h2{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
/* 概览固定三块（请求数 / 总 Token 数 / 缓存命中率），任何宽度下都排在同一行 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.cards{gap:10px}.card{padding:13px 14px 12px}.card .k{font-size:12px}.card .v{margin-top:10px;font-size:24px}.card .v small{font-size:12px}.card .s{font-size:11.5px;gap:3px 10px}.card .spark,.card .spark svg{height:28px}}
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,var(--accent)) 7%,var(--card)) 0,var(--card) 58%);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tint,var(--accent));opacity:.85}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .k{color:var(--muted);font-size:12.5px;font-weight:500}
.card .ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:color-mix(in srgb,var(--tint,var(--accent)) 18%,transparent);color:var(--tint,var(--accent))}
.card .v{margin-top:12px;font-size:30px;font-weight:680;letter-spacing:-.6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.card .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.card .s{margin-top:8px;margin-bottom:2px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
/* 折线图固定贴在卡片底部：三块的图因此落在同一水平线上 */
.card .spark{margin-top:auto;padding-top:12px;height:46px}
.card .spark svg{display:block;width:100%;height:34px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;transition:border-color .15s,background .15s}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input::placeholder{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:600}
.msg{color:var(--muted);padding:16px}
.hidden{display:none}
/* 标题旁的说明图标：悬停/聚焦时自己画气泡，不用原生 title（原生提示依赖浏览器
   的悬停时序，且没法排版多行说明） */
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;line-height:1;vertical-align:middle;cursor:help;user-select:none}
.info:hover,.info:focus{border-color:var(--accent);color:var(--accent)}
.info:focus{outline:none}
.tip{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:40;width:max-content;max-width:min(620px,86vw);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:12px;font-weight:400;line-height:1.7;letter-spacing:0;text-transform:none;text-align:left;white-space:pre-line;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.info:hover .tip,.info:focus .tip{display:block}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard .pk{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.pcard .pv{margin-top:8px;font-size:26px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pcard .pv small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.pcard .bar2{position:relative;height:8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin-top:10px;overflow:hidden}
.pcard .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.pcard .ps{margin-top:8px;color:var(--muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:3px 10px}
.plan-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:12.5px}
.plan-head select{padding:5px 9px;font-size:12.5px;border-radius:9px;max-width:100%}
.plan-warn{color:var(--warn)}
.plan-err{color:var(--err)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Cline 渠道监控<span id="ver"></span></h1>
    <div class="sub" id="statusline">加载中…</div>
  </div>
  <div class="bar" style="margin:0">
    <select id="window">
      <option value="1h">近 1 小时</option>
      <option value="24h" selected>近 24 小时</option>
      <option value="7d">近 7 天</option>
    </select>
    <button id="refresh">刷新</button>
    <button id="forget" title="清除本机保存的管理密钥">清除密钥</button>
  </div>
</header>
<main>
  <section id="gate" class="hidden">
    <div class="card">
      <div class="top"><div class="k">需要 CPA 管理密钥（仅保存在本机浏览器，只用于调用本站管理接口）</div></div>
      <div class="bar" style="margin:12px 0 0">
        <input id="token" type="password" placeholder="粘贴 management key" size="46">
        <button class="primary" id="save">保存并加载</button>
      </div>
    </div>
  </section>

  <section id="plan-section">
    <h2>Cline 套餐用量（官方接口）</h2>
    <div class="plan-head">
      <select id="plan-account" class="hidden" title="按 Cline API Key / 账号切换官方数据（多凭据时显示）"></select>
      <span id="plan-head"></span>
    </div>
    <div class="plan" id="plan-cards"></div>
    <div class="msg hidden" id="plan-msg"></div>
  </section>

  <section>
    <h2>概览<span class="info" id="overview-info" tabindex="0" aria-describedby="overview-info-tip" aria-label="概览口径说明">!<span class="tip" id="overview-info-tip" role="tooltip"></span></span></h2>
    <div class="sub hidden" id="overview-warn" style="margin:-4px 0 12px"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>
<script>
(function(){
"use strict";
const BASE="/v0/management/plugins/clinepass-channel-monitor";
const TOKEN_KEY="cpm-management-key";
const store={
  get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function n(v){return v==null?0:Number(v)||0}
function int(v){return v==null?"-":Math.round(n(v)).toLocaleString("zh-CN")}
function fixed(v,d){return v==null?"-":n(v).toFixed(d==null?2:d)}
// 千位以上转 K/M/B/T（B = billion = 十亿），保留两位小数
function scaled(v){
  const x=n(v);
  if(Math.abs(x)>=1e12)return (x/1e12).toFixed(2)+"T";
  if(Math.abs(x)>=1e9)return (x/1e9).toFixed(2)+"B";
  if(Math.abs(x)>=1e6)return (x/1e6).toFixed(2)+"M";
  if(Math.abs(x)>=1e3)return (x/1e3).toFixed(2)+"K";
  return String(Math.round(x));
}
function fmtTime(ts){if(!ts)return "-";const d=new Date(ts);if(isNaN(d))return ts;const p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
// 官方区间有时是空的（还没取到汇总），此时不要渲染出一个空的 "~"。
function dateRange(from,to){if(!from&&!to)return "";return "（"+(from||"")+" ~ "+(to||"")+"）"}

async function api(path){
  const url=new URL(BASE+path,location.origin);
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+store.get(TOKEN_KEY)},cache:"no-store"});
  if(res.status===401||res.status===403){const e=new Error("unauthorized");e.code=res.status;throw e}
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}

// 迷你折线图（内联 SVG，无外部依赖）
function sparkline(values,color){
  const series=(values||[]).map(v=>n(v));
  if(series.length<2)return "";
  const w=240,h=34,pad=3;
  const max=Math.max.apply(null,series),min=Math.min.apply(null,series);
  const span=max-min||1;
  const step=(w-pad*2)/(series.length-1);
  const pts=series.map((v,i)=>[pad+i*step,pad+(h-pad*2)*(1-(v-min)/span)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+(pad+(series.length-1)*step).toFixed(1)+" "+(h-pad)+" L"+pad+" "+(h-pad)+" Z";
  const gid="sg"+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    "</linearGradient></defs>"+
    '<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    "</svg>";
}

function card(opt){
  const tint=opt.tint||"var(--accent)";
  return '<div class="card" style="--tint:'+tint+'" title="'+esc(opt.tip||"")+'">'+
    '<div class="top"><div class="k">'+esc(opt.label)+'</div><div class="ico">'+esc(opt.icon||"")+"</div></div>"+
    '<div class="v">'+esc(opt.value)+(opt.unit?'<small>'+esc(opt.unit)+"</small>":"")+"</div>"+
    (opt.sub&&opt.sub.length?'<div class="s">'+opt.sub.map(x=>"<span>"+esc(x)+"</span>").join("")+"</div>":"")+
    (opt.spark?'<div class="spark">'+sparkline(opt.spark,tint)+"</div>":"")+
    "</div>";
}

// 一个 CPA 里可能配置了多个 Cline 条目或多把 key，每把 key 对应一个 Cline 账号：
// 官方套餐/限额/用量都是按账号（key）分开的，所以页面顶部有一个账号下拉。
const PLAN_ACCOUNT_KEY="cpm-plan-account";
let planSnapshot=null;

function planAccountList(plan){
  const all=(plan&&plan.accounts)||[];
  if(!all.length)return plan?[plan]:[];
  // 上游拒绝的凭据（401/403，例如把下游客户端 key 当成了 Cline key）不进下拉，
  // 否则会出现一个永远不可用的账号；/health 的 plan_accounts 里仍能看到它。
  return all.filter(a=>a&&a.rejected!==true);
}

function planIgnoredCount(plan){
  const all=(plan&&plan.accounts)||[];
  return Math.max(0,all.length-planAccountList(plan).length);
}

function selectedPlanAccount(plan){
  const list=planAccountList(plan);
  if(!list.length)return plan||null;
  const want=store.get(PLAN_ACCOUNT_KEY);
  let account=list.filter(a=>a&&a.id===want)[0];
  if(!account)account=list.filter(a=>a&&a.available)[0]||list[0];
  return account;
}

function renderAccountPicker(picker,list){
  if(!picker)return;
  if(list.length<2){picker.innerHTML="";picker.classList.add("hidden");return}
  const current=(selectedPlanAccount(planSnapshot)||{}).id||"";
  picker.innerHTML=list.map(function(account){
    const label=(account.label||account.id||"账号")+(account.available===false?"（不可用）":"");
    return '<option value="'+esc(account.id||"")+'"'+(account.id===current?" selected":"")+">"+esc(label)+"</option>";
  }).join("");
  picker.classList.remove("hidden");
}

function quotaTint(pct){if(pct>=90)return "#f87171";if(pct>=70)return "#fbbf24";return "#34d399"}

function renderPlan(plan){
  planSnapshot=plan;
  const head=$("plan-head"), cards=$("plan-cards"), msg=$("plan-msg"), picker=$("plan-account");
  const list=planAccountList(plan);
  renderAccountPicker(picker,list);
  const view=selectedPlanAccount(plan);
  if(!view||view.available===false){
    cards.innerHTML="";
    head.innerHTML="";
    msg.classList.remove("hidden");
    msg.className="msg plan-err";
    const error=(view&&view.error)||(plan&&plan.error)||"";
    if(error.indexOf("no Cline api key")>=0){
      msg.innerHTML='未取到官方用量：插件拿不到 Cline API Key。'+
        '插件会自动读取 CPA 自己的 Cline 凭据，通常不需要配置：确认 CPA 里有 Cline 供应商条目'+
        '（<code>openai-compatibility</code>，条目名是 <code>Cline</code> 或 base-url 命中插件配置的 <code>hosts</code>），'+
        '并确认 <code>plan_config_path</code> 指向容器内可读的 config.yaml。'+
        '<br>读取顺序：CPA config.yaml（<code>openai-compatibility[].api-key-entries</code>）→ CPA 凭据接口。';
    }else if(list.length>1&&error){
      msg.textContent="该账号官方用量暂不可用（"+(view.label||"")+"）："+error;
    }else{
      msg.textContent=error?("未取到官方用量："+error):"官方用量暂不可用。";
    }
    return;
  }
  msg.classList.add("hidden");
  const bits=[];
  if(list.length>1)bits.push(list.length+" 个 Cline 凭据");
  if(planIgnoredCount(plan))bits.push('<span class="plan-warn">已忽略 '+planIgnoredCount(plan)+" 个无效凭据</span>");
  if(view.plan_name)bits.push('<span class="chip">'+esc(view.plan_name)+"</span>");
  if(view.plan_price)bits.push(esc(view.plan_price));
  if(view.account)bits.push("账号 "+esc(view.account));
  if(view.fetched_at)bits.push("套餐更新于 "+esc(fmtTime(view.fetched_at).slice(11,19)));
  if(view.tokens_error)bits.push('<span class="plan-warn">官方汇总未取到：'+esc(view.tokens_error)+"</span>");
  if(view.usage&&view.usage.error)bits.push('<span class="plan-warn">官方逐条用量刷新失败：'+esc(view.usage.error)+"</span>");
  head.innerHTML=bits.join(" · ");

  const blocks=(view.limits||[]).map(function(limit){
    const pct=n(limit.percent_used);
    const warn=pct>=90?" plan-warn":"";
    return '<div class="pcard">'+
      '<div class="pk"><span>'+esc(limit.label||limit.type)+'</span><span class="'+warn.trim()+'">'+fixed(pct,0)+'%</span></div>'+
      '<div class="pv">'+fixed(pct,1)+'<small>% 已用</small></div>'+
      '<div class="bar2"><i style="width:'+fixed(Math.min(100,pct),1)+'%;background:'+quotaTint(pct)+'"></i></div>'+
      '<div class="ps"><span>剩余 '+fixed(100-pct,1)+'%</span><span>重置 '+(limit.resets_in?esc(limit.resets_in):"—")+"</span></div>"+
      '<div class="ps"><span>'+esc(limit.resets_at?fmtTime(limit.resets_at):"")+"</span></div>"+
      "</div>";
  }).join("");

  const tok=view.tokens||{};
  const bals=[];
  if(tok.balance_usd)bals.push("余额 $"+fixed(tok.balance_usd,4));
  if(tok.cost_usd)bals.push("近 31 天成本 $"+fixed(tok.cost_usd,4));
  if(tok.requests)bals.push("官方计费条目 "+int(tok.requests));
  const tokenCard=tok.total_tokens?'<div class="pcard">'+
      '<div class="pk"><span>近 31 天已用 Token（官方）</span></div>'+
      '<div class="pv">'+scaled(tok.total_tokens)+'<small>token</small></div>'+
      '<div class="ps"><span>'+esc((tok.from_date||"")+" ~ "+(tok.to_date||""))+'</span></div>'+
      '<div class="ps"><span>输入 '+scaled(tok.input_tokens)+"</span><span>输出 "+scaled(tok.output_tokens)+"</span></div>"+
      '<div class="ps">'+bals.map(b=>"<span>"+esc(b)+"</span>").join("")+"</div>"+
      "</div>":"";
  cards.innerHTML=blocks+tokenCard;
}

function windowLabel(w){return w==="1h"?"近 1 小时":w==="7d"?"近 7 天":"近 24 小时"}

// officialView returns the selected account's official aggregate for the chosen window.
// Every number on the overview comes from Cline's own API: the local per-request records
// this plugin used to keep are gone, so there is no local fallback left.
function officialView(plan){
  const account=selectedPlanAccount(plan)||{};
  const win=$("window").value||"24h";
  return {win:win,account:account,usage:account.usage||{},off:(account.windows||{})[win]||null};
}

// 概览口径说明挂在「概览」标题旁的感叹号上（悬停显示）；真正需要留意的告警仍然
// 显示在标题下方，不能藏进 tooltip。
function renderOverviewNote(view){
  const icon=$("overview-info"), tip=$("overview-info-tip"), warn=$("overview-warn");
  if(!icon||!tip||!warn)return;
  const off=view.off, notes=[], warns=[];
  const acctTokens=(view.account&&view.account.tokens)||{};
  const cumRange=acctTokens.total_tokens?dateRange(acctTokens.from_date,acctTokens.to_date):"";
  if(off&&off.detail!==false){
    notes.push("「请求数 / 缓存命中率」为官方口径：Cline 账号（含 Cline IDE 等其他客户端）在"+windowLabel(view.win)+"内的计费记录。");
    notes.push("「总 Token 数」为官方累计"+cumRange+"，与上方套餐区同口径，不是该时间窗的量。");
    if(off.covered===false){
      warns.push("官方逐条记录覆盖自 "+fmtTime(view.usage.oldest||"")+"，该窗口更早的部分未统计，官方数值偏低。");
    }
    if(view.usage.error)warns.push("官方用量刷新失败："+view.usage.error);
  }else if(off){
    notes.push("「总 Token 数」为官方累计"+(cumRange||("（"+(off.from||"")+" ~ "+(off.to||"")+"）"))+"。");
    notes.push("「请求数 / 缓存命中率」不适用：「"+windowLabel(view.win)+"」窗口来自官方逐日汇总，官方没有这个窗口的逐条明细。");
    if(off.covered===false)warns.push("官方汇总的覆盖范围待确认，数值可能偏低。");
  }else{
    notes.push("「"+windowLabel(view.win)+"」暂无官方数据。");
    // plan.source 有值才算轮询跑过一轮：刚重载时快照还是空的，那种情况是"还没取到"，
    // 不是"没启用"。
    const polled=!!(planSnapshot&&planSnapshot.source);
    if(view.usage.error)warns.push("官方用量不可用："+view.usage.error);
    else if(!polled)warns.push("官方用量尚未取到。");
    else if(view.usage.enabled!==true)warns.push("官方用量未启用。");
  }
  tip.textContent=notes.join("\n");
  warn.innerHTML=warns.map(text=>'<span class="plan-warn">'+esc(text)+"</span>").join(" ");
  warn.classList.toggle("hidden",warns.length===0);
}

function renderCards(plan){
  const view=officialView(plan), off=view.off;
  const tok=view.account.tokens||{};
  // 逐条用量的刷新时间来自采集器本身（默认 10 分钟一轮），不是套餐轮询的时间戳：
  // 后者每 5 分钟就前进一次，用它会让卡片显示"刚更新过"而数据其实没动。
  const fetched=view.usage&&view.usage.fetched_at?fmtTime(view.usage.fetched_at).slice(11,19):"—";
  // detail=false 的窗口（近 7 天，官方按自然日汇总）只有 token 与成本
  const offDetail=!!(off&&off.detail!==false);
  const series=(off&&off.series)||{};
  // 两种"没有数"要分开说：这个窗口官方本来就没有逐条明细（7 天），和这个账号当前没有
  // 任何官方数据（凭据不可用 / 采集还没覆盖），含义完全不同。
  const noWindow="该账号在这个窗口还没有官方数据（凭据不可用，或官方采集尚未覆盖）";
  const dailyOnly="官方没有该窗口的逐条明细（近 7 天窗口来自官方逐日汇总，只有 token 与成本）";
  const acctRange="官方累计"+dateRange(tok.from_date,tok.to_date);
  const acctSeries=tok.series&&tok.series.length?tok.series:(series.tokens||null);
  const cards=[
    offDetail
      ? card({label:"请求数",icon:"⇄",tint:"#60a5fa",tip:"官方口径：Cline 账号在该时间窗内的计费请求数（含其他客户端）。",
          value:int(off.requests),unit:"条",
          sub:["官方逐条用量 · 更新于 "+fetched,"窗口 "+(off.from?fmtTime(off.from).slice(5,16):"—")+" ~ "+(off.to?fmtTime(off.to).slice(5,16):"—")],
          spark:series.requests})
      : card({label:"请求数",icon:"⇄",tint:"#60a5fa",tip:off?dailyOnly:noWindow,value:"—",unit:"条",sub:[off?dailyOnly:noWindow]}),
    off
      ? card({label:"总 Token 数",icon:"Σ",tint:"#38bdf8",tip:"官方口径：主值为账号累计 token（近 31 天逐日汇总），副行为本窗口官方输入/输出。",
          value:scaled(tok.total_tokens||off.total_tokens),unit:"token",
          sub:[
            acctRange,
            "本窗口 输入 "+scaled(off.input_tokens)+" / 输出 "+scaled(off.output_tokens)+(off.cost_usd?" · $"+fixed(off.cost_usd,4):"")
          ],
          spark:acctSeries})
      : card({label:"总 Token 数",icon:"Σ",tint:"#38bdf8",tip:"官方口径：账号累计 token（近 31 天逐日汇总）",
          value:scaled(tok.total_tokens),unit:"token",
          sub:[acctRange,"输入 "+scaled(tok.input_tokens)+" / 输出 "+scaled(tok.output_tokens)],
          spark:acctSeries}),
    offDetail
      ? card({label:"缓存命中率",icon:"%",tint:"#34d399",tip:"官方口径：cachedTokens / promptTokens（本窗口）。",
          value:fixed(n(off.cache_ratio)*100,2),unit:"%",
          sub:["官方 cached "+scaled(off.cached_tokens)+" / prompt "+scaled(off.input_tokens)],
          spark:series.cached})
      : card({label:"缓存命中率",icon:"%",tint:"#34d399",tip:off?dailyOnly:noWindow,value:"—",unit:"%",sub:[off?dailyOnly:noWindow]})
  ];
  $("cards").innerHTML=cards.join("");
  renderOverviewNote(view);
}

async function load(){
  try{
    const health=await api("/health");
    $("ver").textContent="v"+health.version;
    const bits=["运行 "+esc(health.uptime||"-")];
    if(health.plan_enabled===false)bits.push('<span class="plan-warn">套餐轮询未启用</span>');
    if(health.plan_usage&&health.plan_usage.enabled)bits.push("官方逐条用量已启用");
    $("statusline").innerHTML=bits.join(" · ");
    renderPlan(health.plan);
    // The overview is rendered independently: a credential whose plan/limits call failed
    // can still have usable official usage, and a failed account must never leave the
    // previous account's numbers on screen.
    renderCards(health.plan);
    $("gate").classList.add("hidden");
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
    }else{
      $("statusline").textContent="加载失败："+err.message;
    }
  }
}

$("save").addEventListener("click",()=>{const v=$("token").value.trim();if(!v)return;store.set(TOKEN_KEY,v);load()});
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
$("forget").addEventListener("click",()=>{store.del(TOKEN_KEY);$("token").value="";$("gate").classList.remove("hidden");$("statusline").textContent="已清除本机保存的密钥"});
$("refresh").addEventListener("click",()=>load());
$("window").addEventListener("change",()=>{renderCards(planSnapshot||{})});
$("plan-account").addEventListener("change",()=>{store.set(PLAN_ACCOUNT_KEY,$("plan-account").value);renderPlan(planSnapshot||{});renderCards(planSnapshot||{})});

if(!store.get(TOKEN_KEY))$("gate").classList.remove("hidden");
load();
setInterval(()=>{if(store.get(TOKEN_KEY))load()},60000);
})();
</script>
