<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cline 渠道监控</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#15171c;--muted:#6a7280;--line:#e5e8ec;--accent:#2563eb;--accent-soft:rgba(37,99,235,.08);--warn:#b45309;--err:#b91c1c;--ok:#15803d;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#14181f;--fg:#e9ecf1;--muted:#8b95a5;--line:#222833;--accent:#60a5fa;--accent-soft:rgba(96,165,250,.12);--warn:#fbbf24;--err:#f87171;--ok:#4ade80;--chip:#1b2029}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.sub{color:var(--muted);font-size:12px}
main{padding:22px 24px 44px;max-width:1800px;margin:0 auto}
section{margin-bottom:26px}
h2{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,var(--accent)) 7%,var(--card)) 0,var(--card) 58%);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tint,var(--accent));opacity:.85}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .k{color:var(--muted);font-size:12.5px;font-weight:500}
.card .ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:color-mix(in srgb,var(--tint,var(--accent)) 18%,transparent);color:var(--tint,var(--accent))}
.card .v{margin-top:12px;font-size:30px;font-weight:680;letter-spacing:-.6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.card .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.card .s{margin-top:8px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card .spark{margin-top:12px;height:34px}
.card .spark svg{display:block;width:100%;height:34px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;transition:border-color .15s,background .15s}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
input::placeholder{color:var(--muted)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 13px;text-align:left;white-space:nowrap;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--card) 84%,var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:1px;line-height:1.4}
.stack .m{color:var(--muted);font-size:11.5px}
.tok{display:flex;flex-direction:column;gap:1px;line-height:1.45}
.tok .row2{display:flex;justify-content:space-between;gap:14px}
.tok .lbl{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;line-height:1.5}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tag.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line));background:color-mix(in srgb,var(--err) 10%,transparent)}
.tag.miss{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:600}
.cache-bar{position:relative;height:4px;border-radius:3px;background:color-mix(in srgb,var(--err) 30%,var(--line));margin-top:5px;overflow:hidden;min-width:72px}
.cache-bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:3px}
.detail td{background:color-mix(in srgb,var(--bg) 55%,var(--card));white-space:normal;padding:0}
.detail .inner{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:16px 18px}
.detail h3{margin:0 0 7px;font-size:12px;color:var(--muted);font-weight:600}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.detail pre{margin:0;max-height:260px;overflow:auto;font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.msg{color:var(--muted);padding:16px}
.hidden{display:none}
.mode{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.empty-row td{text-align:center;color:var(--muted);padding:20px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard .pk{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.pcard .pv{margin-top:8px;font-size:26px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pcard .pv small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.pcard .bar2{position:relative;height:8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin-top:10px;overflow:hidden}
.pcard .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.pcard .ps{margin-top:8px;color:var(--muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:3px 10px}
.plan-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:12.5px}
.plan-warn{color:var(--warn)}
.plan-err{color:var(--err)}
</style>
<header>
  <div>
    <h1>Cline 渠道监控<span id="ver"></span></h1>
    <div class="sub" id="statusline">加载中…</div>
  </div>
  <div class="bar" style="margin:0">
    <span class="mode" id="mode">-</span>
    <select id="window">
      <option value="1h">近 1 小时</option>
      <option value="24h" selected>近 24 小时</option>
      <option value="7d">近 7 天</option>
    </select>
    <button id="refresh">刷新</button>
    <button id="export">导出 CSV</button>
    <button id="forget" title="清除本机保存的管理密钥">清除密钥</button>
  </div>
</header>
<main>
  <section id="gate" class="hidden">
    <div class="card">
      <div class="top"><div class="k">需要 CPA 管理密钥（仅保存在本机浏览器，只用于调用本站管理接口）</div></div>
      <div class="bar" style="margin:12px 0 0">
        <input id="token" type="password" placeholder="粘贴 management key" size="46">
        <button class="primary" id="save">保存并加载</button>
      </div>
    </div>
  </section>

  <section id="plan-section">
    <h2>Cline 套餐用量（官方接口）</h2>
    <div class="plan-head" id="plan-head"></div>
    <div class="plan" id="plan-cards"></div>
    <div class="msg hidden" id="plan-msg"></div>
  </section>

  <section>
    <h2>概览</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>渠道分布</h2>
    <div class="wrap"><table id="channels"><thead>
      <tr><th>渠道</th><th class="num">请求</th><th class="num">失败</th><th class="num">成本($)</th><th class="num">平均延时</th><th class="num">平均 TTFT</th><th class="num">Token 输入/输出</th><th class="num">上游缓存命中率</th></tr>
    </thead><tbody></tbody></table></div>
  </section>

  <section>
    <h2>明细</h2>
    <div class="bar">
      <input id="f-channel" placeholder="渠道" size="10">
      <input id="f-model" placeholder="模型" size="20">
      <input id="f-source" placeholder="来源 key" size="14">
      <select id="f-result"><option value="">全部结果</option><option value="success">成功</option><option value="failed">失败</option><option value="missing_channel">无渠道</option></select>
      <button id="apply" class="primary">应用过滤</button>
      <span class="sub" id="pageinfo"></span>
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
    <div class="wrap"><table id="events"><thead>
      <tr>
        <th>时间</th><th>来源</th><th>渠道</th><th>模型</th><th>思考等级</th><th>结果</th><th>请求</th>
        <th class="num">延时 / TTFT</th><th class="num">生成速度</th><th class="num">Token</th><th class="num">缓存</th><th class="num">成本</th>
      </tr>
    </thead><tbody></tbody></table></div>
    <div class="msg hidden" id="empty">当前筛选条件下没有记录。</div>
  </section>
</main>
<script>
(function(){
"use strict";
const BASE="/v0/management/plugins/clinepass-channel-monitor";
const TOKEN_KEY="cpm-management-key";
const PAGE_SIZE=50;
const state={offset:0,total:0};
const store={
  get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function n(v){return v==null?0:Number(v)||0}
function int(v){return v==null?"-":Math.round(n(v)).toLocaleString("zh-CN")}
function fixed(v,d){return v==null?"-":n(v).toFixed(d==null?2:d)}
// 千位以上转 K/M/G，保留两位小数
function scaled(v){
  const x=n(v);
  if(Math.abs(x)>=1e9)return (x/1e9).toFixed(2)+"G";
  if(Math.abs(x)>=1e6)return (x/1e6).toFixed(2)+"M";
  if(Math.abs(x)>=1e3)return (x/1e3).toFixed(2)+"K";
  return String(Math.round(x));
}
// 时长：<1000ms 用 ms，>=1000ms 转 s 保留两位小数
function dur(v){
  const x=n(v);
  if(!x)return "-";
  if(x<1000)return Math.round(x)+" ms";
  return (x/1000).toFixed(2)+" s";
}
function shortKey(k){if(!k)return "-";return k.length>16?k.slice(0,4)+"…"+k.slice(-4):k}
function fmtTime(ts){if(!ts)return "-";const d=new Date(ts);if(isNaN(d))return ts;const p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function endpointLabel(v){if(!v)return "-";if(v==="openai-response")return "/v1/responses";if(v==="openai"||v==="chat-completions")return "/v1/chat/completions";if(v==="claude"||v==="anthropic")return "/v1/messages";return v}
function ratio(hit,miss){const t=n(hit)+n(miss);return t>0?n(hit)/t:0}
function effort(v){const map={max:"最高",xhigh:"极高",high:"高",medium:"中",low:"低",minimal:"极低"};return map[v]||v||"-"}

async function api(path,params){
  const url=new URL(BASE+path,location.origin);
  if(params)Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!=null)url.searchParams.set(k,v)});
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+store.get(TOKEN_KEY)},cache:"no-store"});
  if(res.status===401||res.status===403){const e=new Error("unauthorized");e.code=res.status;throw e}
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}

// 迷你折线图（内联 SVG，无外部依赖）
function sparkline(values,color){
  const series=(values||[]).map(v=>n(v));
  if(series.length<2)return "";
  const w=240,h=34,pad=3;
  const max=Math.max.apply(null,series),min=Math.min.apply(null,series);
  const span=max-min||1;
  const step=(w-pad*2)/(series.length-1);
  const pts=series.map((v,i)=>[pad+i*step,pad+(h-pad*2)*(1-(v-min)/span)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+(pad+(series.length-1)*step).toFixed(1)+" "+(h-pad)+" L"+pad+" "+(h-pad)+" Z";
  const gid="sg"+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    "</linearGradient></defs>"+
    '<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    "</svg>";
}

function card(opt){
  const tint=opt.tint||"var(--accent)";
  return '<div class="card" style="--tint:'+tint+'" title="'+esc(opt.tip||"")+'">'+
    '<div class="top"><div class="k">'+esc(opt.label)+'</div><div class="ico">'+esc(opt.icon||"")+"</div></div>"+
    '<div class="v">'+esc(opt.value)+(opt.unit?'<small>'+esc(opt.unit)+"</small>":"")+"</div>"+
    (opt.sub&&opt.sub.length?'<div class="s">'+opt.sub.map(x=>"<span>"+esc(x)+"</span>").join("")+"</div>":"")+
    (opt.spark?'<div class="spark">'+sparkline(opt.spark,tint)+"</div>":"")+
    "</div>";
}

function renderCards(s){
  const tok=s.tokens||{}, cost=s.cost||{}, pc=s.prompt_cache||{}, series=s.series||{};
  const requests=n(s.requests)||1;
  const cacheRatio=ratio(pc.hit,pc.miss);
  const perRequestCost=n(cost.total)/requests;
  const cards=[
    card({label:"请求数",icon:"⇄",tint:"#60a5fa",tip:"当前时间窗内落盘的 Cline 请求数",
      value:int(s.requests),unit:"条",
      sub:[s.failed?("失败 "+int(s.failed)+"（"+fixed(n(s.error_rate)*100,2)+"%）"):"无失败","成功率 "+fixed(100-n(s.error_rate)*100,2)+"%"],
      spark:series.requests}),
    card({label:"平均延时",icon:"◷",tint:"#a78bfa",tip:"平均总延时；副值为平均首 token 延时（TTFT）",
      value:fixed(n(s.avg_latency_ms)/1000,2),unit:"s",
      sub:["平均 TTFT "+dur(s.avg_ttft_ms),"样本 "+int(s.ttft_requests)+" 条"],
      spark:series.latency_ms}),
    card({label:"生成速度",icon:"⚡",tint:"#f59e0b",tip:"平均生成速度 = output_tokens / 生成耗时",
      value:fixed(s.tokens_per_second_avg,2),unit:"tok/s",sub:["越高越快"],spark:series.tokens_per_second}),
    card({label:"输入 / 输出 合计",icon:"Σ",tint:"#38bdf8",tip:"时间窗内输入 token 与输出 token 的总量",
      value:scaled(tok.input)+" / "+scaled(tok.output),unit:"入/出",
      sub:["总计 "+scaled(tok.total),"推理 "+scaled(tok.reasoning)],spark:series.tokens}),
    card({label:"输入 / 输出 每请求",icon:"÷",tint:"#22d3ee",tip:"平均每个请求消耗的输入 token 与输出 token",
      value:scaled(tok.avg_input)+" / "+scaled(tok.avg_output),unit:"入/出",
      sub:["输入含缓存命中部分"],spark:series.requests}),
    card({label:"缓存命中率",icon:"%",tint:"#34d399",tip:"上游网关口径：promptCacheHit/(hit+miss)；CPA 口径见副值",
      value:fixed(cacheRatio*100,2),unit:"%",
      sub:["上游口径 hit "+scaled(pc.hit)+" / miss "+scaled(pc.miss),"CPA 口径 "+fixed(n(s.cache_ratio)*100,2)+"%（cached/input）"],
      spark:series.cache_hits}),
    card({label:"总成本",icon:"$",tint:"#fbbf24",tip:"上游网关按请求返回的成本求和（美元）",
      value:"$ "+fixed(cost.total,6),unit:"",
      sub:["每请求 $"+fixed(perRequestCost,6),cost.unparsed?("未解析 "+int(cost.unparsed)+" 条"):"全部可解析"],
      spark:series.cost})
  ];
  $("cards").innerHTML=cards.join("");
}

let planSnapshot=null;

function quotaTint(pct){if(pct>=90)return "#f87171";if(pct>=70)return "#fbbf24";return "#34d399"}

function renderPlan(plan){
  planSnapshot=plan;
  const head=$("plan-head"), cards=$("plan-cards"), msg=$("plan-msg");
  if(!plan||plan.available===false){
    cards.innerHTML="";
    head.innerHTML="";
    msg.classList.remove("hidden");
    msg.className="msg plan-err";
    if(plan&&plan.error&&plan.error.indexOf("no Cline api key")>=0){
      msg.innerHTML='未取到官方用量：插件拿不到 Cline API Key。请二选一：'+
        '① 在插件配置里填 <code>plan_api_key</code>（就是配置 Cline 条目时用的那个 key）；'+
        '② 保持 <code>plan_enabled: false</code> 关闭这张卡片。'+
        '<br>读取顺序：插件配置 <code>plan_api_key</code> → CPA 的凭据接口 → CPA 的 config.yaml → 最近一次上游请求的 Authorization 头。';
    }else{
      msg.textContent=plan&&plan.error?("未取到官方用量："+plan.error):"官方用量暂不可用。";
    }
    return;
  }
  msg.classList.add("hidden");
  const bits=[];
  if(plan.plan_name)bits.push('<span class="chip">'+esc(plan.plan_name)+"</span>");
  if(plan.plan_price)bits.push(esc(plan.plan_price));
  if(plan.account)bits.push("账号 "+esc(plan.account));
  if(plan.fetched_at)bits.push("更新于 "+esc(fmtTime(plan.fetched_at).slice(11,19)));
  head.innerHTML=bits.join(" · ");

  const blocks=(plan.limits||[]).map(function(limit){
    const pct=n(limit.percent_used);
    const warn=pct>=90?" plan-warn":"";
    return '<div class="pcard">'+
      '<div class="pk"><span>'+esc(limit.label||limit.type)+'</span><span class="'+warn.trim()+'">'+fixed(pct,0)+'%</span></div>'+
      '<div class="pv">'+fixed(pct,1)+'<small>% 已用</small></div>'+
      '<div class="bar2"><i style="width:'+fixed(Math.min(100,pct),1)+'%;background:'+quotaTint(pct)+'"></i></div>'+
      '<div class="ps"><span>剩余 '+fixed(100-pct,1)+'%</span><span>重置 '+(limit.resets_in?esc(limit.resets_in):"—")+"</span></div>"+
      '<div class="ps"><span>'+esc(limit.resets_at?fmtTime(limit.resets_at):"")+"</span></div>"+
      "</div>";
  }).join("");

  const tok=plan.tokens||{};
  const bals=[];
  if(tok.balance_usd)bals.push("余额 $"+fixed(tok.balance_usd,4));
  if(tok.cost_usd)bals.push("近 31 天成本 $"+fixed(tok.cost_usd,4));
  if(tok.requests)bals.push("官方计费条目 "+int(tok.requests));
  const tokenCard=tok.total_tokens?'<div class="pcard">'+
      '<div class="pk"><span>近 31 天已用 Token（官方）</span><span>'+esc((tok.from_date||"")+" ~ "+(tok.to_date||""))+'</span></div>'+
      '<div class="pv">'+scaled(tok.total_tokens)+'<small>token</small></div>'+
      '<div class="ps"><span>输入 '+scaled(tok.input_tokens)+"</span><span>输出 "+scaled(tok.output_tokens)+"</span></div>"+
      '<div class="ps">'+bals.map(b=>"<span>"+esc(b)+"</span>").join("")+"</div>"+
      "</div>":"";
  cards.innerHTML=blocks+tokenCard;
}

function renderChannels(rows){
  const body=$("channels").querySelector("tbody");
  if(!rows||!rows.length){body.innerHTML='<tr class="empty-row"><td colspan="8">该时间窗内没有渠道数据。</td></tr>';return}
  body.innerHTML=rows.map(r=>"<tr>"+
    '<td><span class="chip">'+esc(r.key)+"</span></td>"+
    '<td class="num">'+int(r.requests)+"</td>"+
    '<td class="num">'+(r.failed?'<span class="tag err">'+int(r.failed)+"</span>":"0")+"</td>"+
    '<td class="num">'+fixed(r.cost,6)+"</td>"+
    '<td class="num">'+dur(r.avg_latency_ms)+"</td>"+
    '<td class="num">'+dur(r.avg_ttft_ms)+"</td>"+
    '<td class="num">'+scaled(r.avg_input_tokens)+" / "+scaled(r.avg_output_tokens)+"</td>"+
    '<td class="num">'+fixed(n(r.prompt_cache_ratio)*100,2)+"%</td>"+
    "</tr>").join("");
}

function detailPanel(e){
  const dl=pairs=>'<dl>'+pairs.filter(p=>p[1]!==undefined&&p[1]!==null&&p[1]!=="").map(p=>"<dt>"+esc(p[0])+"</dt><dd>"+esc(p[1])+"</dd>").join("")+"</dl>";
  return '<tr class="detail hidden"><td colspan="12"><div class="inner">'+
    "<div><h3>请求</h3>"+dl([
      ["上游地址",e.base_url],["客户端协议",e.client_protocol],["上游协议",e.upstream_protocol],
      ["stream",e.stream?"是":"否"],["session",e.session_id],["CPA 内部 provider",e.provider],
      ["凭据 auth_index",e.auth_index],["凭据类型",e.auth_type],["event_id",e.event_id]
    ])+"</div>"+
    "<div><h3>渠道与成本</h3>"+dl([
      ["finalProvider",e.final_provider],["resolvedProvider",e.resolved_provider],
      ["canonicalSlug",e.canonical_slug],["originalModelId",e.original_model_id],
      ["modelAttemptCount",e.model_attempt_count],["totalProviderAttemptCount",e.total_provider_attempt_count],
      ["fallbacksAvailable",e.fallbacks_available_count],["generationId",e.generation_id],
      ["cost",e.cost],["inputInferenceCost",e.input_cost],["outputInferenceCost",e.output_cost]
    ])+"</div>"+
    "<div><h3>token 与缓存</h3>"+dl([
      ["input / output",int(e.input_tokens)+" / "+int(e.output_tokens)],
      ["reasoning",int(e.reasoning_tokens)],["total",int(e.total_tokens)],
      ["cached / cache_read / cache_creation",int(e.cached_tokens)+" / "+int(e.cache_read_tokens)+" / "+int(e.cache_creation_tokens)],
      ["prompt_cache hit / miss",int(e.prompt_cache_hit_tokens)+" / "+int(e.prompt_cache_miss_tokens)],
      ["systemFingerprint",e.system_fingerprint],["失败原因",e.error],["status code",e.status_code?String(e.status_code):""]
    ])+"</div>"+
    "<div><h3>planningReasoning</h3><pre>"+esc(e.planning_reasoning||("未落盘（长度 "+int(e.planning_reasoning_length)+" 字符）"))+"</pre></div>"+
    "</div></td></tr>";
}

function renderEvents(list){
  const body=$("events").querySelector("tbody");
  $("empty").classList.toggle("hidden",!!(list&&list.length));
  if(!list||!list.length){body.innerHTML="";return}
  body.innerHTML=list.map((e,i)=>{
    const tag=e.failed?'<span class="tag err">失败'+(e.status_code?" "+e.status_code:"")+"</span>":(e.channel_missing?'<span class="tag miss">无渠道</span>':'<span class="tag ok">成功</span>');
    const hit=n(e.prompt_cache_hit_tokens),miss=n(e.prompt_cache_miss_tokens);
    const cacheRatio=ratio(hit,miss);
    return '<tr class="row" data-i="'+i+'">'+
      '<td><div class="stack">'+esc(fmtTime(e.timestamp))+"</div></td>"+
      '<td title="'+esc(e.api_key)+'"><span class="mono">'+esc(shortKey(e.api_key))+"</span></td>"+
      '<td><span class="chip">'+esc(e.final_provider||"—")+"</span></td>"+
      '<td><div class="stack">'+esc(e.model_alias||e.model||"-")+'<span class="m">'+esc(e.model||"")+"</span></div></td>"+
      "<td>"+esc(effort(e.reasoning_effort))+"</td>"+
      "<td>"+tag+"</td>"+
      '<td><div class="stack">'+esc(endpointLabel(e.client_protocol))+'<span class="m">'+(e.stream?"SSE":"非流式")+'</span></div></td>'+
      '<td class="num"><div class="stack">'+esc(dur(e.latency_ms))+'<span class="m">TTFT '+esc(dur(e.ttft_ms))+'</span></div></td>'+
      '<td class="num"><div class="stack">'+fixed(e.tokens_per_second,2)+' t/s<span class="m">TTFT 后 '+fixed(e.tokens_per_second_after_ttft,2)+' t/s</span></div></td>'+
      '<td class="num"><div class="tok">'+
        '<span class="row2"><span class="lbl">↑ 输入</span><span>'+scaled(e.input_tokens)+"</span></span>"+
        '<span class="row2"><span class="lbl">↓ 输出</span><span>'+scaled(e.output_tokens)+"</span></span>"+
        (n(e.reasoning_tokens)?'<span class="row2"><span class="lbl">◇ 思考</span><span>'+scaled(e.reasoning_tokens)+"</span></span>":"")+
      "</div></td>"+
      '<td class="num"><div class="stack"><span>'+scaled(hit)+" / "+scaled(miss)+"</span>"+
        '<span class="m">命中 '+fixed(cacheRatio*100,2)+'%</span><span class="cache-bar"><i style="width:'+fixed(cacheRatio*100,2)+'%"></i></span></div></td>'+
      '<td class="num">'+(e.cost?esc("$"+e.cost):"—")+"</td>"+
      "</tr>"+detailPanel(e);
  }).join("");
  body.querySelectorAll("tr.row").forEach(tr=>{
    tr.addEventListener("click",()=>{
      const next=tr.nextElementSibling;
      if(next&&next.classList.contains("detail"))next.classList.toggle("hidden");
    });
  });
}

async function load(){
  const w=$("window").value;
  try{
    const health=await api("/health");
    $("ver").textContent="v"+health.version;
    $("mode").textContent=(health.mode||"-")+" · "+(health.hosts&&health.hosts.length?health.hosts.join(", "):"hosts 为空");
    const bits=["记录 "+int(health.recorded)+" 条","已索引 "+int(health.ring_used)+"/"+int(health.ring_size),
      "marker 缺失 "+int(health.marker_missing),"host 未命中 "+int(health.skipped_unmatched_host),
      "解析失败 "+int(health.parse_errors),"写盘失败 "+int(health.write_error)];
    if(health.jsonl_enabled)bits.push("JSONL "+health.jsonl_dir);
    $("statusline").textContent=bits.join(" · ");

    const stats=await api("/stats",{window:w});
    renderPlan(stats.plan);
    renderCards(stats);
    renderChannels(stats.channels);

    const events=await api("/events",{window:w,limit:PAGE_SIZE,offset:state.offset,
      channel:$("f-channel").value.trim(),model:$("f-model").value.trim(),
      source:$("f-source").value.trim(),result:$("f-result").value});
    state.total=n(events.total);
    renderEvents(events.events);
    const from=state.total?state.offset+1:0,to=Math.min(state.offset+PAGE_SIZE,state.total);
    $("pageinfo").textContent="第 "+from+"-"+to+" 条 / 共 "+int(state.total)+" 条";
    $("prev").disabled=state.offset<=0;
    $("next").disabled=state.offset+PAGE_SIZE>=state.total;
    $("gate").classList.add("hidden");
  }catch(err){
    if(err.code===401||err.code===403){
      $("gate").classList.remove("hidden");
      $("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）";
    }else{
      $("statusline").textContent="加载失败："+err.message;
    }
  }
}

$("save").addEventListener("click",()=>{const v=$("token").value.trim();if(!v)return;store.set(TOKEN_KEY,v);state.offset=0;load()});
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
$("forget").addEventListener("click",()=>{store.del(TOKEN_KEY);$("token").value="";$("gate").classList.remove("hidden");$("statusline").textContent="已清除本机保存的密钥"});
$("refresh").addEventListener("click",()=>load());
$("window").addEventListener("change",()=>{state.offset=0;load()});
$("apply").addEventListener("click",()=>{state.offset=0;load()});
$("prev").addEventListener("click",()=>{state.offset=Math.max(0,state.offset-PAGE_SIZE);load()});
$("next").addEventListener("click",()=>{state.offset+=PAGE_SIZE;load()});
$("export").addEventListener("click",()=>{
  const url=new URL(BASE+"/export",location.origin);
  const params={window:$("window").value,channel:$("f-channel").value.trim(),model:$("f-model").value.trim(),
    source:$("f-source").value.trim(),result:$("f-result").value};
  Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!=null)url.searchParams.set(k,v)});
  fetch(url,{headers:{"Authorization":"Bearer "+store.get(TOKEN_KEY)},cache:"no-store"}).then(res=>{
    if(!res.ok)throw new Error("HTTP "+res.status);
    return res.blob();
  }).then(blob=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="clinepass-channel-monitor-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".csv";
    document.body.appendChild(a);a.click();a.remove();
  }).catch(err=>{alert("导出失败："+err.message)});
});

if(!store.get(TOKEN_KEY))$("gate").classList.remove("hidden");
load();
setInterval(()=>{if(store.get(TOKEN_KEY))load()},60000);
})();
</script>
