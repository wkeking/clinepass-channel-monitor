<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cline 渠道监控</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--fg:#16181d;--muted:#666c78;--line:#e3e6ea;--accent:#2563eb;--warn:#b45309;--err:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#181b21;--fg:#e8eaee;--muted:#9aa3b2;--line:#272b33;--accent:#60a5fa;--warn:#fbbf24;--err:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:12px}
main{padding:18px;max-width:1600px;margin:0 auto}
section{margin-bottom:22px}
h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .k{color:var(--muted);font-size:12px;margin-bottom:4px}
.card .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.card .s{color:var(--muted);font-size:11px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:color-mix(in srgb,var(--card) 70%,var(--bg));font-size:12px;color:var(--muted);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.tag.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.tag.miss{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.detail td{background:color-mix(in srgb,var(--bg) 60%,var(--card));white-space:normal}
.detail pre{margin:0;max-height:320px;overflow:auto;font-size:12px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.msg{color:var(--muted);padding:14px 0}
.hidden{display:none}
.mode{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Cline 渠道监控 <span class="sub" id="ver"></span></h1>
    <div class="sub" id="statusline">加载中…</div>
  </div>
  <div class="bar">
    <span class="mode" id="mode">-</span>
    <select id="window">
      <option value="1h">近 1 小时</option>
      <option value="24h" selected>近 24 小时</option>
      <option value="7d">近 7 天</option>
    </select>
    <button id="refresh">刷新</button>
    <button id="export">导出 CSV</button>
    <button id="forget" title="清除本机保存的管理密钥">清除密钥</button>
  </div>
</header>
<main>
  <section id="gate" class="hidden">
    <div class="card">
      <div class="k">需要 CPA 管理密钥（只存在本机浏览器，不会发送到本页面之外）</div>
      <div class="bar" style="margin:10px 0 0">
        <input id="token" type="password" placeholder="粘贴 management key" size="46">
        <button class="primary" id="save">保存并加载</button>
      </div>
      <div class="sub" id="gatem sg"></div>
    </div>
  </section>

  <section>
    <h2>概览</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>渠道分布</h2>
    <div class="wrap"><table id="channels"><thead>
      <tr><th>渠道</th><th class="num">请求</th><th class="num">失败</th><th class="num">成本($)</th><th class="num">平均延时(ms)</th><th class="num">平均 TTFT(ms)</th><th class="num">平均输入</th><th class="num">平均输出</th></tr>
    </thead><tbody></tbody></table></div>
  </section>

  <section>
    <h2>明细</h2>
    <div class="bar">
      <input id="f-channel" placeholder="渠道" size="12">
      <input id="f-model" placeholder="模型" size="24">
      <input id="f-source" placeholder="来源 key" size="16">
      <select id="f-result"><option value="">全部结果</option><option value="success">成功</option><option value="failed">失败</option><option value="missing_channel">无渠道</option></select>
      <button id="apply" class="primary">应用过滤</button>
      <span class="sub" id="pageinfo"></span>
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
    <div class="wrap"><table id="events"><thead>
      <tr>
        <th>时间</th><th>来源</th><th>模型</th><th>上游地址</th><th>渠道</th>
        <th class="num">延时(ms)</th><th class="num">TTFT(ms)</th><th class="num">tok/s</th>
        <th class="num">输入</th><th class="num">输出</th><th class="num">缓存命中</th><th class="num">缓存未命中</th>
        <th class="num">成本($)</th><th>结果</th>
      </tr>
    </thead><tbody></tbody></table></div>
    <div class="msg hidden" id="empty">当前筛选条件下没有记录。</div>
  </section>
</main>
<script>
(function(){
"use strict";
const BASE="/v0/management/plugins/clinepass-channel-monitor";
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const TOKEN_KEY="cpm-management-key";
const PAGE_SIZE=50;
let state={offset:0,total:0};

function $(id){return document.getElementById(id)}
function fmtNum(n){if(n==null||n===0&&arguments.length<2)return n==null?"-":"0";return Number(n).toLocaleString("zh-CN")}
function fmtFloat(n,d){if(n==null)return"-";return Number(n).toFixed(d==null?2:d)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shortKey(k){if(!k)return"-";return k.length>14?k.slice(0,6)+"…"+k.slice(-4):k}
function fmtTime(ts){if(!ts)return"-";const d=new Date(ts);if(isNaN(d))return ts;const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}

function token(){return store.get(TOKEN_KEY)}
async function api(path,params){
  const url=new URL(BASE+path,location.origin);
  if(params)Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!=null)url.searchParams.set(k,v)});
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+token()},cache:"no-store"});
  if(res.status===401||res.status===403){const e=new Error("unauthorized");e.code=res.status;throw e}
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}

function showGate(show,msg){$("gate").classList.toggle("hidden",!show);if(msg)$("gatesg");if(msg)$("gatesg")}

function renderCards(s){
  const cards=[
    ["请求数",fmtNum(s.requests),s.failed?("失败 "+fmtNum(s.failed)+"（"+fmtFloat(s.error_rate*100,1)+"%）"):"无失败"],
    ["平均延时",fmtNum(Math.round(s.avg_latency_ms||0))+" ms",""],
    ["平均 TTFT",fmtNum(Math.round(s.avg_ttft_ms||0))+" ms","有 TTFT 的 "+fmtNum(s.ttft_requests||0)+" 次"],
    ["生成速度",fmtFloat(s.tokens_per_second_avg,1)+" tok/s",""],
    ["输入 / 输出","["+fmtNum(s.tokens?Math.round(s.tokens.avg_input):0)+" / "+fmtNum(s.tokens?Math.round(s.tokens.avg_output):0)+"]","均值"],
    ["缓存命中率",fmtFloat((s.cache_ratio||0)*100,1)+" %","cached/input"],
    ["上游缓存命中率",fmtFloat(((s.prompt_cache&&s.prompt_cache.ratio)?s.prompt_cache.ratio:0)*100,1)+" %","prompt_cache_hit/(hit+miss)"],
    ["总成本","$"+fmtFloat(s.cost?s.cost.total:0,6),s.cost&&s.cost.unparsed?("未解析 "+s.cost.unparsed):""],
    ["无渠道记录",fmtNum(s.channel_missing),"失败请求属正常"]
  ];
  $("cards").innerHTML=cards.map(c=>'<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+esc(c[1])+'</div><div class="s">'+esc(c[2])+'</div></div>').join("");
}

function renderChannels(rows){
  const body=$("channels").querySelector("tbody");
  if(!rows||!rows.length){body.innerHTML='<tr><td colspan="8" class="msg">该时间窗内没有渠道数据。</td></tr>';return}
  body.innerHTML=rows.map(r=>"<tr>"+
    "<td>"+esc(r.key)+"</td>"+
    '<td class="num">'+fmtNum(r.requests)+"</td>"+
    '<td class="num">'+(r.failed?fmtNum(r.failed):"0")+"</td>"+
    '<td class="num">'+fmtFloat(r.cost,6)+"</td>"+
    '<td class="num">'+fmtNum(Math.round(r.avg_latency_ms||0))+"</td>"+
    '<td class="num">'+fmtNum(Math.round(r.avg_ttft_ms||0))+"</td>"+
    '<td class="num">'+fmtNum(Math.round(r.avg_input_tokens||0))+"</td>"+
    '<td class="num">'+fmtNum(Math.round(r.avg_output_tokens||0))+"</td>"+
    "</tr>").join("");
}

function detailRow(e){
  const meta={planning_reasoning:e.planning_reasoning||("（未落盘，长度 "+fmtNum(e.planning_reasoning_length||0)+" 字符）"),
    client_protocol:e.client_protocol,upstream_protocol:e.upstream_protocol,stream:e.stream,
    model_attempt_count:e.model_attempt_count,total_provider_attempt_count:e.total_provider_attempt_count,
    fallbacks_available_count:e.fallbacks_available_count,generation_id:e.generation_id,
    resolved_provider:e.resolved_provider,canonical_slug:e.canonical_slug,original_model_id:e.original_model_id,
    system_fingerprint:e.system_fingerprint,auth_index:e.auth_index,auth_type:e.auth_type,
    provider:e.provider,event_id:e.event_id,session_id:e.session_id,parent_session_id:e.parent_session_id,
    status_code:e.status_code,error:e.error};
  return '<tr class="detail"><td colspan="14"><pre>'+esc(JSON.stringify(meta,null,2))+"</pre></td></tr>";
}

function renderEvents(list){
  const body=$("events").querySelector("tbody");
  $("empty").classList.toggle("hidden",!!(list&&list.length));
  if(!list||!list.length){body.innerHTML="";return}
  body.innerHTML=list.map((e,i)=>{
    const tag=e.failed?'<span class="tag err">失败 '+(e.status_code||"")+"</span>":(e.channel_missing?'<span class="tag miss">无渠道</span>':'<span class="tag ok">成功</span>');
    return "<tr data-i=\""+i+"\">"+
      "<td>"+esc(fmtTime(e.timestamp))+"</td>"+
      "<td title=\""+esc(e.api_key)+"\">"+esc(shortKey(e.api_key))+"</td>"+
      "<td>"+esc(e.model_alias||e.model||"-")+"<div class=\"sub\">"+esc(e.model||"")+"</div></td>"+
      "<td>"+esc(e.base_url||"-")+"</td>"+
      "<td>"+esc(e.final_provider||"—")+"</td>"+
      '<td class="num">'+fmtNum(e.latency_ms)+"</td>"+
      '<td class="num">'+fmtNum(e.ttft_ms)+"</td>"+
      '<td class="num">'+fmtFloat(e.tokens_per_second,2)+"</td>"+
      '<td class="num">'+fmtNum(e.input_tokens)+"</td>"+
      '<td class="num">'+fmtNum(e.output_tokens)+"</td>"+
      '<td class="num">'+fmtNum(e.prompt_cache_hit_tokens)+"</td>"+
      '<td class="num">'+fmtNum(e.prompt_cache_miss_tokens)+"</td>"+
      '<td class="num">'+esc(e.cost||"—")+"</td>"+
      "<td>"+tag+"</td></tr>"+detailRow(e);
  }).join("");
  body.querySelectorAll("tr[data-i]").forEach(tr=>{
    tr.addEventListener("click",()=>{
      const next=tr.nextElementSibling;
      if(next&&next.classList.contains("detail"))next.classList.toggle("hidden");
    });
  });
  body.querySelectorAll("tr.detail").forEach(r=>r.classList.add("hidden"));
}

async function load(){
  const w=$("window").value;
  try{
    const health=await api("/health");
    $("ver").textContent="v"+health.version;
    $("mode").textContent=(health.mode||"-")+" · "+(health.hosts&&health.hosts.length?health.hosts.join(", "):"（hosts 为空）");
    const bits=["记录 "+fmtNum(health.recorded)+" 条","已索引 "+fmtNum(health.ring_used)+"/"+fmtNum(health.ring_size),
      "marker 缺失 "+fmtNum(health.marker_missing),"host 未命中 "+fmtNum(health.skipped_unmatched_host),
      "解析失败 "+fmtNum(health.parse_errors),"写盘失败 "+fmtNum(health.write_error)];
    if(health.jsonl_enabled)bits.push("JSONL 开启（"+health.jsonl_dir+"）");
    $("statusline").textContent=bits.join(" · ");

    const stats=await api("/stats",{window:w});
    renderCards(stats);
    renderChannels(stats.channels);

    const params={window:w,limit:PAGE_SIZE,offset:state.offset,
      channel:$("f-channel").value.trim(),model:$("f-model").value.trim(),
      source:$("f-source").value.trim(),result:$("f-result").value};
    const events=await api("/events",params);
    state.total=events.total||0;
    renderEvents(events.events);
    const from=state.total?state.offset+1:0,to=Math.min(state.offset+PAGE_SIZE,state.total);
    $("pageinfo").textContent="第 "+from+"-"+to+" 条 / 共 "+fmtNum(state.total)+" 条";
    $("prev").disabled=state.offset<=0;
    $("next").disabled=state.offset+PAGE_SIZE>=state.total;
    $("gate").classList.add("hidden");
  }catch(err){
    if(err.code===401||err.code===403){showGate(true);$("statusline").textContent="管理密钥无效或缺失（HTTP "+err.code+"）"}else{
      $("statusline").textContent="加载失败："+err.message;
    }
  }
}

$("save").addEventListener("click",()=>{const v=$("token").value.trim();if(!v)return;store.set(TOKEN_KEY,v);state.offset=0;load()});
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
$("forget").addEventListener("click",()=>{store.del(TOKEN_KEY);$("token").value="";showGate(true);$("statusline").textContent="已清除本机保存的密钥"});
$("refresh").addEventListener("click",()=>load());
$("window").addEventListener("change",()=>{state.offset=0;load()});
$("apply").addEventListener("click",()=>{state.offset=0;load()});
$("prev").addEventListener("click",()=>{state.offset=Math.max(0,state.offset-PAGE_SIZE);load()});
$("next").addEventListener("click",()=>{state.offset+=PAGE_SIZE;load()});
$("export").addEventListener("click",()=>{
  const url=new URL(BASE+"/export",location.origin);
  const params={window:$("window").value,channel:$("f-channel").value.trim(),model:$("f-model").value.trim(),
    source:$("f-source").value.trim(),result:$("f-result").value};
  Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!=null)url.searchParams.set(k,v)});
  fetch(url,{headers:{"Authorization":"Bearer "+token()},cache:"no-store"}).then(res=>{
    if(!res.ok)throw new Error("HTTP "+res.status);
    return res.blob();
  }).then(blob=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="clinepass-channel-monitor-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".csv";
    document.body.appendChild(a);a.click();a.remove();
  }).catch(err=>{alert("导出失败："+err.message)});
});

if(!token())showGate(true);
load();
setInterval(()=>{if(token())load()},60000);
})();
</script>
</body>
</html>
